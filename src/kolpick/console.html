<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kolpick 决策台</title>
<style>
/* Look and interactions follow the UI/UX design canvas (docs/design.md §三 决策台). */
:root{--bg:#F5F4F0;--panel:#FFFFFF;--ink:#1C1B19;--muted:#6B6A64;--sub:#5F5E58;--line:#E4E2DC;--line2:#EFEDE8;--soft:#F0EFEA;--faint:#FAF9F6;
  --accent:#3A5BD9;--accent-ink:#2B46AE;--accent-bg:#EEF1FC;--accent-bg2:#F6F8FE;--ok:#1E6B3E;--ok-bg:#E8F5EC;--warn:#8A4A00;--warn-bg:#FFF3E0;--warn-line:#F3DDB5;
  --bad:#B42318;--bad-ink:#7A1A12;--bad-bg:#FDEDEB;--bad-line:#F4C7C2}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;font-family:-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.55}
a{color:var(--accent)}a:hover{color:var(--accent-ink)}
button{font:inherit;cursor:pointer}
button[disabled]{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;color:var(--ink)}
.top{display:flex;align-items:center;gap:20px;padding:0 24px;min-height:56px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;z-index:10}
.logo{font-weight:700;font-size:17px}
.env{font-size:12px;padding:2px 10px;border-radius:99px;background:var(--soft);color:#4A4944;font-weight:500}
.env.prod{background:var(--bad-bg);color:var(--bad)}
.nav{display:flex;gap:2px}
.nav a{color:var(--sub);text-decoration:none;padding:8px 12px;border-radius:8px}
.nav a.on{background:var(--accent-bg);color:var(--accent-ink);font-weight:500}
.count{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:99px;background:var(--accent);color:#fff;font-size:12px;text-align:center}
.count.bad{background:var(--bad)}
.sp{flex:1}
.stat{font-size:13px;color:var(--sub);display:flex;gap:16px;align-items:center}
.dot{display:inline-block;width:8px;height:8px;border-radius:99px;background:#1E7A45;margin-right:6px}
.dot.warn{background:#D97706}.dot.bad{background:var(--bad)}.dot.off{background:#B5B3AC}
.pause{display:flex;align-items:center;gap:8px;font-size:13px;border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:6px 12px 6px 6px}
.sw{width:34px;height:20px;border-radius:99px;background:#D9D7D0;position:relative;flex:none;border:0;padding:0;display:inline-block}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:99px;background:#fff;transition:left .15s}
.sw.on{background:var(--accent)}.sw.on::after{left:16px}
.pause.on{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}
.pause.on .sw{background:#D97706}.pause.on .sw::after{left:16px}
.bar-warn{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 24px;background:var(--warn-bg);color:var(--warn);border-bottom:1px solid var(--warn-line);font-size:13px}
.alert{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:16px 24px 0;padding:12px 16px;background:var(--bad-bg);border:1px solid var(--bad-line);border-radius:10px;color:var(--bad-ink)}
.okbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:16px 24px 0;padding:10px 16px;background:var(--ok-bg);border:1px solid #BFE2CB;border-radius:10px;color:var(--ok);font-size:13px}
.wrap{max-width:1280px;margin:0 auto;padding:16px 24px 40px}
.btn{font-size:14px;border-radius:8px;padding:8px 14px;border:1px solid #DCDAD3;background:var(--panel);color:var(--ink);min-height:40px;display:inline-flex;gap:8px;align-items:center;text-decoration:none;white-space:nowrap}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
.btn.quiet{border-color:transparent;background:transparent;color:var(--bad)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:500}
.key{font-size:11px;border:1px solid currentColor;border-radius:4px;padding:0 4px;opacity:.7}
.link{background:none;border:0;color:var(--accent);padding:0;text-decoration:underline;font-size:13px}
.meta{font-size:13px;color:var(--muted)}
.hint{font-size:12px;color:var(--muted)}
.tag{font-size:11px;padding:1px 7px;border-radius:5px;background:var(--soft);color:#4A4944;font-weight:500;white-space:nowrap}
.tag.blue{background:var(--accent-bg);color:var(--accent-ink)}.tag.amber{background:var(--warn-bg);color:var(--warn)}.tag.green{background:var(--ok-bg);color:var(--ok)}.tag.red{background:var(--bad-bg);color:var(--bad)}.tag.dark{background:var(--ink);color:#fff}
.field{display:block;width:100%;border:1px solid #DCDAD3;border-radius:8px;padding:8px 10px;background:var(--panel)}
textarea.field{resize:vertical}
.label{font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:500;display:block}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.h1{font-size:20px;font-weight:700;margin:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.h2{font-size:15px;font-weight:700;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.empty{padding:48px 24px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:center}
.big{font-size:20px;font-weight:700;color:var(--ink)}
.chip{font-size:13px;border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:4px 12px;color:#4A4944;display:inline-flex;gap:6px;align-items:center}
.chip b{font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}.chip.on b{color:#fff}
.chip.warn{border-color:var(--warn-line);background:#FFF8EC;color:var(--warn)}
.chip.bad{border-color:var(--bad-line);background:var(--bad-bg);color:var(--bad)}
.pill{font-size:13px;border:1px solid #DCDAD3;background:var(--panel);border-radius:99px;padding:4px 12px;min-height:32px}
.pill.on{border-color:var(--accent);background:var(--accent-bg);color:var(--accent-ink);font-weight:500}
.panel{padding:14px 16px;border:1px solid #C9D3F5;background:var(--accent-bg2);border-radius:10px;display:flex;flex-direction:column;gap:10px}
.panel.red{border-color:var(--bad-line);background:#FFF8F7}
.radio{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;text-align:left;background:var(--panel);width:100%}
.radio.on{border-color:var(--accent);background:var(--accent-bg2)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;gap:14px;align-items:center;background:var(--ink);color:#fff;border-radius:12px;padding:10px 12px 10px 18px;box-shadow:0 10px 30px rgba(0,0,0,.22);z-index:40;max-width:calc(100% - 32px);flex-wrap:wrap}
.toast .btn{min-height:34px;padding:5px 12px;font-size:13px;background:transparent;color:#fff;border-color:#5F5E58}
.ring{display:inline-flex;width:24px;height:24px;border-radius:99px;border:2px solid #8EA2EE;align-items:center;justify-content:center;font-size:12px}
.modalbg{position:fixed;inset:0;background:rgba(28,27,25,.38);display:flex;align-items:flex-start;justify-content:center;padding:80px 16px;z-index:50}
.modal{background:var(--panel);border-radius:14px;width:100%;max-width:540px;padding:20px 22px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal h2{margin:0;font-size:18px}
.steps{padding:12px 16px;border:1px dashed #D9D7D0;border-radius:10px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.step{display:flex;gap:10px;align-items:baseline}
.n{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;border-radius:99px;background:var(--soft);font-size:12px;font-weight:500;flex:none}
.bubble{background:var(--bg);border-radius:4px 12px 12px 12px;padding:12px 14px;white-space:pre-wrap;word-break:break-word;max-height:420px;overflow:auto}
.offline{position:fixed;inset:0;background:var(--bg);z-index:60;display:flex;align-items:center;justify-content:center;padding:24px}
code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--bg);padding:2px 6px;border-radius:5px}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);margin:0}

/* 待你决定 */
.dbody{display:flex;flex-wrap:wrap;gap:16px;padding:16px 24px 24px;align-items:flex-start}
.queue{flex:1 1 340px;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;position:sticky;top:72px;max-height:calc(100vh - 90px);overflow-y:auto}
.qchips{display:flex;gap:6px;flex-wrap:wrap;padding:12px;border-bottom:1px solid var(--line)}
.qchip{font-size:12px;border:1px solid var(--line);background:var(--panel);color:var(--sub);border-radius:99px;padding:3px 10px}
.qchip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.item{display:block;width:100%;text-align:left;background:var(--panel);border:0;border-bottom:1px solid var(--line2);padding:12px 14px;color:var(--ink)}
.item.on{background:var(--accent-bg);box-shadow:inset 3px 0 0 var(--accent)}
.itop{display:flex;gap:8px;align-items:center}
.iname{font-weight:500;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.itime{font-size:12px;color:var(--muted)}
.isub{font-size:13px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qhead{font-size:12px;color:var(--muted);padding:10px 14px 4px;background:var(--faint)}
.ghost{padding:10px 14px;color:var(--muted);font-size:13px;border-bottom:1px solid var(--line2);display:flex;gap:8px;align-items:center}
.detail{flex:999 1 640px;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column}
.dhead{padding:18px 22px 14px;border-bottom:1px solid var(--line2)}
.why{margin-top:10px;padding:10px 12px;background:var(--faint);border-radius:8px;font-size:13px;color:#4A4944}
.edited{font-size:12px;color:var(--warn);background:var(--warn-bg);border-radius:6px;padding:2px 8px;display:inline-block;margin-top:6px}
.cols{display:flex;flex-wrap:wrap}
.col{flex:1 1 320px;min-width:0;padding:16px 22px}
.col+.col{border-left:1px solid var(--line2)}
.sec{padding:0 22px 16px}
.dbar{margin-top:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 22px;border-top:1px solid var(--line2);background:#FCFBF9;border-radius:0 0 12px 12px;position:sticky;bottom:0}
.draft{min-height:260px;line-height:1.7}
.quota{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
.q{flex:1 1 200px;border:1px solid var(--line2);border-radius:10px;padding:10px 12px}
.q b{font-size:20px;font-variant-numeric:tabular-nums}
.q.over{border-color:var(--bad-line);background:#FFF8F7}
.track{height:6px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:6px}
.fill{height:6px;background:var(--accent);border-radius:99px}
.fill.over{background:var(--bad)}
.grow{display:grid;grid-template-columns:32px minmax(0,1.5fr) minmax(0,1.4fr) 90px 80px;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid #F3F1EC;font-size:13px}
.grow.head{font-size:12px;color:var(--muted);font-weight:500;background:#FBFAF7;position:sticky;top:0}
.grow.off{color:#A3A29C}
.grow.cur{background:var(--accent-bg2)}
.gbox{border:1px solid var(--line2);border-radius:10px;overflow:auto;max-height:420px}
.rowbtn{background:none;border:0;padding:0;color:inherit;text-align:left}
.rowbtn:hover{text-decoration:underline}
.preview{background:var(--faint);border-radius:10px;padding:12px 14px;white-space:pre-wrap;font-size:13px;line-height:1.7;max-height:420px;overflow:auto}
.diff{display:flex;flex-wrap:wrap;gap:0}
.cand{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line2);font-size:13px}

/* KOL 列表 */
.ltitle{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:4px 0 14px}
.lstrip,.lfilters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.sel{font-size:13px;border:1px solid #DCDAD3;border-radius:8px;padding:6px 10px;background:var(--panel)}
.lbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.lscroll{overflow-x:auto}
.lscroll>div{min-width:1180px}
.lg{display:grid;grid-template-columns:36px minmax(190px,1.5fr) 64px 120px minmax(170px,1.5fr) minmax(140px,1.1fr) 110px minmax(130px,1fr) 48px;gap:10px;align-items:start;padding:10px 12px;border-bottom:1px solid #F3F1EC;font-size:13px}
.lg.head{font-size:12px;color:var(--muted);font-weight:500;background:#FBFAF7;align-items:center}
.lg.sel{background:var(--accent-bg2)}
.lg:not(.head):hover{background:var(--faint)}
.who{display:flex;gap:10px;align-items:center;min-width:0}
.av{width:32px;height:32px;border-radius:99px;background:var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#4A4944;flex:none}
.lname{font-weight:500;color:var(--ink);text-decoration:none}
.lname:hover{text-decoration:underline}
.sub{font-size:12px;color:var(--muted);display:block}
.snip{display:block;color:#4A4944;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.turn{font-size:12px;display:block;margin-top:4px}
.turn.us{color:var(--warn);font-weight:500}
.mini{width:64px;height:5px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:4px;display:block}
.mini i{display:block;height:5px;background:var(--accent)}
.flag{font-size:12px;padding:1px 7px;border-radius:6px;white-space:nowrap;display:inline-block;margin:0 4px 4px 0}
.flag.bad{background:var(--bad-bg);color:var(--bad)}.flag.warn{background:var(--warn-bg);color:var(--warn)}
.cell{font-size:13px;text-align:left;background:none;border:0;padding:4px 6px;margin:-4px -6px;border-radius:6px;color:var(--ink);min-width:0}
.cell:hover{background:var(--accent-bg)}
.chev{font-size:12px;background:none;border:1px solid var(--line);border-radius:6px;color:#4A4944;padding:3px 0;min-height:28px}
.exp{display:flex;flex-wrap:wrap;gap:16px;padding:14px 16px 16px 58px;background:#FBFAF7;border-bottom:1px solid var(--line);box-shadow:inset 3px 0 0 var(--accent)}
.pane{min-width:0;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:12px 14px}
.msg{font-size:13px;padding:8px 10px;border-radius:8px;margin-bottom:6px;white-space:pre-wrap;word-break:break-word;max-width:92%}
.msg.in{background:var(--bg)}
.msg.out{background:var(--accent-bg);margin-left:auto}
.msg.note{background:none;color:var(--muted);font-size:12px;text-align:center;max-width:100%}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid #F3F1EC;font-size:13px}
.post{border:1px solid var(--line2);border-radius:8px;padding:8px 10px;margin-bottom:8px;font-size:13px}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:6px 0}
.metrics span{display:flex;flex-direction:column}
.metrics b{font-variant-numeric:tabular-nums;font-size:15px}
.metrics i{font-style:normal;font-size:11px;color:var(--muted)}
.late{color:var(--warn);font-weight:500}
.lfoot{display:flex;align-items:center;gap:12px;padding:10px 14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.bulk{position:sticky;bottom:16px;margin:14px auto 0;max-width:760px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--ink);color:#fff;border-radius:12px;padding:10px 12px 10px 18px;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:5}
.bulk .btn{min-height:36px;padding:6px 12px;font-size:13px;background:transparent;border-color:#4A4944;color:#fff}
.pop{position:absolute;bottom:56px;right:12px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:6px;display:flex;flex-direction:column;min-width:160px;box-shadow:0 10px 24px rgba(0,0,0,.15)}
.pop button{font-size:13px;text-align:left;background:none;border:0;padding:8px 10px;border-radius:6px;color:var(--ink)}
.pop button:hover{background:var(--bg)}

/* KOL 详情 */
.khead{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:10px 0 16px}
.kav{width:56px;height:56px;border-radius:99px;background:var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;color:#4A4944}
.knext{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px;background:#FFF8EC;border:1px solid var(--warn-line);border-radius:10px;margin-bottom:16px}
.kcols{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.kmain{flex:999 1 600px;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.kside{flex:1 1 320px;max-width:380px;display:flex;flex-direction:column;gap:16px}
.tabs{display:flex;gap:4px;padding:10px 12px;border-bottom:1px solid var(--line2)}
.tab{font-size:13px;border:0;background:transparent;padding:6px 12px;border-radius:8px;color:var(--sub)}
.tab.on{background:var(--soft);color:var(--ink);font-weight:500}
.thread{padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.tmsg{max-width:80%;border-radius:12px;padding:10px 14px;white-space:pre-wrap;word-break:break-word}
.tmsg.in{align-self:flex-start;background:var(--bg);border-top-left-radius:4px}
.tmsg.out{align-self:flex-end;background:var(--accent-bg);border-top-right-radius:4px}
.tmsg.note{align-self:center;background:transparent;color:var(--muted);font-size:12px;padding:0}
.compose{border-top:1px solid var(--line2);padding:14px 20px;display:flex;flex-direction:column;gap:8px}
.dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.dl label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.crow{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #F3F1EC;font-size:13px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:right;font-weight:500;color:var(--muted);font-size:12px;padding:4px 6px;border-bottom:1px solid var(--line2)}
table.t td{text-align:right;padding:6px;border-bottom:1px solid #F3F1EC}
table.t th:first-child,table.t td:first-child{text-align:left}

/* 找人 */
.seg{display:inline-flex;border:1px solid #DCDAD3;border-radius:10px;overflow:hidden}
.seg button{font-size:13px;border:0;background:var(--panel);padding:8px 14px;color:#4A4944;min-height:36px}
.seg button+button{border-left:1px solid #DCDAD3}
.seg button.on{background:var(--ink);color:#fff}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px;margin-top:12px}
.fgrid label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px;font-weight:500}
.full{grid-column:1/-1}
.unit{display:flex;gap:8px;align-items:center}
.unit .field{width:120px}

/* 记录 */
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.statb{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-width:96px}
.statb b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.statb span{font-size:12px;color:var(--muted)}
.now{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13px}
.spin{width:12px;height:12px;border-radius:99px;border:2px solid var(--accent);border-top-color:transparent;display:inline-block;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.rday{font-size:12px;font-weight:500;color:var(--muted);padding:8px 16px;background:#FBFAF7;border-bottom:1px solid var(--line2)}
.rrow{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:start;padding:10px 16px;border-bottom:1px solid #F3F1EC}
.rrow.bad{background:#FFF8F7}
.rtime{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.rlinks{display:flex;gap:10px;font-size:13px;white-space:nowrap}
.rdetail{grid-column:2/4;background:var(--faint);border-radius:8px;padding:10px 12px;font-size:13px;white-space:pre-wrap;color:#4A4944;word-break:break-word}

/* 设置 */
.swrap{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.smenu{flex:1 1 200px;max-width:220px;display:flex;flex-direction:column;gap:2px;position:sticky;top:72px}
.smenu a{text-decoration:none;color:var(--sub);padding:8px 12px;border-radius:8px}
.smenu a.on{background:var(--panel);color:var(--ink);font-weight:500;box-shadow:0 0 0 1px var(--line)}

@media (max-width:760px){.sgrid,.fgrid{grid-template-columns:minmax(0,1fr)}.col+.col{border-left:0;border-top:1px solid var(--line2)}.queue{position:static;max-height:none}}
</style>
</head>
<body>
<header class="top">
  <span class="logo">kolpick</span><span id="env" class="env"></span>
  <nav class="nav" id="nav" aria-label="主导航"></nav>
  <span class="sp"></span>
  <span class="stat" id="stat"></span>
  <button class="pause" id="pause" type="button" aria-pressed="false"><span class="sw"></span><span id="pauseLabel">暂停所有发送</span></button>
</header>
<div id="bars"></div>
<main id="main"></main>
<div id="modal"></div>
<div id="toast" class="toast" hidden role="status" aria-live="polite"></div>
<div id="offline" class="offline" hidden>
  <div class="empty"><span class="big">连不上这台电脑上的 kolpick</span>
    <span>通常是电脑刚开机、刚睡醒，或者服务正在重启。每 5 秒自动重连一次（已试 <span id="tries">0</span> 次）。</span>
    <span>连不上的时候什么都不会发；恢复后会自动补收这段时间的信。</span>
    <button class="btn primary" id="retry" type="button">现在重连</button>
    <span class="hint">一分钟还不行：在终端运行 <code>kolpick restart</code>。</span></div>
</div>
<script>
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = (n) => String(n).padStart(2, "0");
function when(t) {
  if (!t) return "";
  const d = new Date(t), now = new Date();
  const hm = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const days = Math.round((new Date(now.toDateString()) - new Date(d.toDateString())) / 86400000);
  if (days === 0) return "今天 " + hm;
  if (days === 1) return "昨天 " + hm;
  return `${d.getMonth() + 1}/${d.getDate()}`;
}
const ago = (t) => { if (!t) return ""; const m = Math.round((Date.now() - new Date(t)) / 60000); return m < 1 ? "刚刚" : m < 60 ? `${m} 分钟前` : m < 1440 ? `${Math.round(m / 60)} 小时前` : when(t); };
const md = (t) => (t ? `${new Date(t).getMonth() + 1}/${new Date(t).getDate()}` : "");
const fans = (n) => (n == null ? "—" : n >= 10000 ? `${(n / 10000).toFixed(n >= 100000 ? 0 : 1)} 万` : n.toLocaleString());
const num = (n) => (n == null ? "—" : n >= 10000 ? `${(n / 10000).toFixed(1)} 万` : Number(n).toLocaleString());
const STAGES = { new: "未联系", invited: "已邀约", replied: "已回复", trial: "体验中", report_seen: "已看报告", publish_agreed: "已约发布", published: "已发布", partner: "合作中", on_hold: "暂缓", closed: "结案" };
const STAGE_CLS = { partner: "green", trial: "amber", replied: "blue", report_seen: "blue", publish_agreed: "blue", published: "green" };
const CLOSE = ["无回应", "题材不符", "只接固定费", "宗教信仰", "隐私", "档期", "拒绝", "回复后失联", "退信或邮箱无效", "作废", "其他"];
const KINDS = { reply: "回信", mail: "主动写信", invite: "邀约", followup: "催信", code_expiry: "码到期", checkin: "问发布", invite_batch: "邀约批", followup_group: "催信批",
  unmatched: "对不上人", bounce: "退信", no_reply: "不用回", close: "建议结案", template: "模板新版", discovery: "找到的人", legacy: "旧审核单", other: "要你拍板" };
const KIND_CLS = { reply: "blue", mail: "blue", followup: "blue", code_expiry: "amber", checkin: "amber", invite_batch: "green", followup_group: "green", bounce: "red", other: "amber" };

async function api(path, body) {
  let r;
  try {
    r = await fetch("/api" + path, body === undefined ? {} : { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  } catch (e) { goOffline(); throw new Error("连不上本地服务"); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

// ---------- 通用：提示条、弹窗、离线 ----------
let toastTimer = null;
function toast(text, opts = {}) {
  const t = $("#toast");
  clearInterval(toastTimer);
  let secs = opts.undo ? 5 : 0;
  const draw = () => {
    t.innerHTML = (opts.undo ? `<span class="ring">${secs}</span>` : "") + `<span>${esc(text)}</span>`
      + (opts.undo ? `<button class="btn" id="tUndo" type="button">撤销 Z</button>` : "")
      + (opts.link ? `<a class="btn" href="${opts.link[1]}">${esc(opts.link[0])}</a>` : "")
      + (!opts.undo ? `<button class="btn" id="tOk" type="button">好</button>` : "");
    t.hidden = false;
    if ($("#tUndo")) $("#tUndo").onclick = doUndo;
    if ($("#tOk")) $("#tOk").onclick = () => { t.hidden = true; clearInterval(toastTimer); };
  };
  const doUndo = async () => { clearInterval(toastTimer); t.hidden = true; undoFn = null; try { await opts.undo(); toast("已撤销，回到原位"); refresh(); } catch (e) { toast("没撤销成功：" + e.message); } };
  undoFn = opts.undo ? doUndo : null;
  draw();
  if (opts.undo) toastTimer = setInterval(() => { secs--; if (secs <= 0) { clearInterval(toastTimer); undoFn = null; text = opts.after || text; opts = { link: opts.link }; draw(); toastTimer = setTimeout(() => (t.hidden = true), 3500); } else draw(); }, 1000);
  else toastTimer = setTimeout(() => (t.hidden = true), opts.long ? 6000 : 3500);
}
let undoFn = null;
async function act(fn, ok, opts = {}) {
  try { const r = await fn(); if (ok) toast(typeof ok === "function" ? ok(r) : ok, opts); await refresh(); return r; } catch (e) { toast("没成功：" + e.message); }
}
function modal(html, wire) {
  $("#modal").innerHTML = `<div class="modalbg" id="mbg"><div class="modal" role="dialog">${html}</div></div>`;
  $("#mbg").onclick = (e) => { if (e.target.id === "mbg") closeModal(); };
  wire && wire($("#modal"));
}
const closeModal = () => ($("#modal").innerHTML = "");

let offline = false, tries = 0, retryTimer = null;
function goOffline() {
  if (offline) return;
  offline = true; $("#offline").hidden = false;
  retryTimer = setInterval(tryBack, 5000);
}
async function tryBack() {
  tries++; $("#tries").textContent = tries;
  try { const r = await fetch("/api/state"); if (r.ok) { offline = false; tries = 0; clearInterval(retryTimer); $("#offline").hidden = true; refresh(); } } catch {}
}
$("#retry").onclick = tryBack;

// ---------- 框架 ----------
let S = {}, U = {}, route = [], view = {};
const PAGES = [["decide", "待你决定"], ["kols", "KOL"], ["log", "记录"], ["settings", "设置"]];
function parseRoute() { route = (location.hash.slice(1) || "decide").split("/"); }
function drawTop() {
  const c = S.counts || {};
  const waiting = (c.pending || 0) + (c.problems || 0);
  const page = route[0] === "kol" || route[0] === "find" ? "kols" : route[0];
  $("#nav").innerHTML = PAGES.map(([k, v]) => `<a href="#${k}" class="${k === page ? "on" : ""}">${v}${k === "decide" && waiting ? `<span class="count ${c.problems ? "bad" : ""}">${waiting}</span>` : ""}</a>`).join("");
  $("#env").textContent = (S.env === "prod" ? "正式库" : "测试库") + (S.project ? " · " + S.project : "");
  $("#env").className = "env " + (S.env === "prod" ? "prod" : "");
  const w = Object.entries(S.status?.watchers || {});
  const down = w.filter(([, v]) => !v.up);
  const watch = !S.auto?.inbox ? `<span><span class="dot off"></span>收信监听关着</span>`
    : down.length ? `<span><span class="dot warn"></span>${esc(down.map(([k]) => k.split("@")[0] + "@").join("、"))} 收信监听断了</span>`
    : `<span><span class="dot"></span>收信监听正常 · ${w.length} 个邮箱</span>`;
  $("#stat").innerHTML = watch + (U.dailyLimit ? `<span>今天已联系 ${U.contacted} / ${U.dailyLimit} 人</span>` : "");
  $("#pause").classList.toggle("on", !!S.paused);
  $("#pause").setAttribute("aria-pressed", String(!!S.paused));
  $("#pauseLabel").textContent = S.paused ? "已暂停发送" : "暂停所有发送";
  let bars = "";
  if (S.paused) bars += `<div class="bar-warn" role="status"><b>所有发送已暂停</b><span class="sp" style="min-width:240px">可以照常同意，卡片会排队，不建码、不发信。恢复后按同意的先后发出。排队中 ${c.approved || 0} 张。</span><button class="btn sm" type="button" data-unpause>恢复发送</button></div>`;
  for (const [addr, v] of down) if (S.auto?.inbox) bars += `<div class="bar-warn" role="status"><b>${esc(addr)} 的实时收信断了</b><span class="sp" style="min-width:240px">改为每 2 分钟补收一次，来信最多晚 2 分钟出现，不会漏。系统会自动重连。${v.error ? "原因：" + esc(v.error) : ""}</span></div>`;
  $("#bars").innerHTML = bars;
  const up = $("[data-unpause]"); if (up) up.onclick = togglePause;
}
const togglePause = () => act(() => api("/tool/pause_sending", { on: !S.paused }), S.paused ? "已恢复发送，排队的按同意顺序发出" : "已暂停所有发送");
$("#pause").onclick = togglePause;

async function refresh() {
  try { [S, U] = await Promise.all([api("/state"), api("/usage")]); } catch (e) { if (offline) return; }
  drawTop();
  await render();
}
async function render() {
  parseRoute(); drawTop();
  const m = $("#main");
  try {
    if (route[0] === "decide") return await renderDecide(m);
    if (route[0] === "kols") return await renderKols(m);
    if (route[0] === "kol") return await renderKol(m, Number(route[1]));
    if (route[0] === "find") return renderFind(m);
    if (route[0] === "log") return await renderLog(m);
    if (route[0] === "settings") return await renderSettings(m);
    location.hash = "decide";
  } catch (e) { if (!offline) m.innerHTML = `<div class="wrap"><div class="card"><b>出错了：</b>${esc(e.message)}</div></div>`; }
}
window.onhashchange = () => { closeModal(); render(); };

// ---------- 待你决定 ----------
const D = { filter: "all", sel: null, mode: null, rej: "leave", revOn: {}, edits: {}, batchOff: {}, batchCur: {}, candOff: {}, alertDone: null };
const GROUPS = [["all", "全部"], ["problem", "出问题了"], ["mail", "回一封信"], ["batch", "发一批"], ["decide", "要你拍板"], ["done", "已处理"]];
function groupOf(c) {
  if (c.status === "unknown" || c.status === "failed" || c.kind === "unmatched" || c.kind === "bounce") return "problem";
  if (c.kind === "invite_batch" || c.kind === "followup_group") return "batch";
  if (c.to_addr && !c.items) return "mail";
  return "decide";
}
function subOf(c) {
  if (c.status === "unknown") return "结果不明：" + (c.result || "要你确认");
  if (c.status === "failed") return "没做成：" + (c.result || "");
  if (c.items) return `${c.items.length} 项 · ${c.title || ""}`;
  return c.title && c.title !== c.kol_name ? c.title : (c.why || "").slice(0, 60);
}
let cards = [], drafting = [], done = [];
async function loadCards() {
  const [pending, problems, dr, dn] = await Promise.all([api("/cards?view=pending"), api("/cards?view=problems"), api("/cards?view=drafting"), api("/cards?view=done")]);
  const all = problems.concat(pending.filter((p) => !problems.some((x) => x.id === p.id)));
  all.forEach((c) => (c.group = groupOf(c)));
  // 出问题的固定在最上面，按意见改好的接着，其余按先来后到。
  cards = all.filter((c) => c.group === "problem").concat(all.filter((c) => c.group !== "problem" && c.feedback), all.filter((c) => c.group !== "problem" && !c.feedback));
  drafting = dr.filter((d) => !d.parent_id);
  done = dn.filter((d) => !d.parent_id);
}
async function renderDecide(m) {
  await loadCards();
  if (route[1]) { D.sel = Number(route[1]); history.replaceState(null, "", "#decide"); }
  const visible = D.filter === "all" ? cards : cards.filter((c) => c.group === D.filter);
  if (!cards.some((c) => c.id === D.sel)) D.sel = (visible[0] || cards[0])?.id ?? null;
  const cur = cards.find((c) => c.id === D.sel);
  const unknown = cards.filter((c) => c.status === "unknown");
  let h = "";
  if (unknown.length) {
    const u = unknown[0];
    h += `<div class="alert" role="alert"><span style="flex:1;min-width:240px"><b>${unknown.length} 件事要你确认：</b>${esc(u.kol_name || "")}「${esc(u.title || "")}」${esc(u.result || "结果不明")}。系统不会自动重做，请到 ${esc(u.mailbox || "邮箱")} 的「已发送」里看一眼。</span>
      <button class="btn" type="button" data-resolve="${u.id}" data-happened="1">邮箱里有，已发出</button><button class="btn" type="button" data-resolve="${u.id}" data-happened="0">没发出，重新审</button></div>`;
  }
  if (D.alertDone) h += `<div class="okbar"><span class="sp">${esc(D.alertDone)}</span><button class="link" type="button" data-hideok>知道了</button></div>`;
  const count = (g) => (g === "done" ? done.length : g === "all" ? cards.length : cards.filter((c) => c.group === g).length);
  h += `<div class="dbody"><section class="queue" aria-label="待你决定"><div class="qchips" role="group" aria-label="按要你做什么">${GROUPS.map(([k, v]) => `<button class="qchip ${D.filter === k ? "on" : ""}" type="button" data-filter="${k}" aria-pressed="${D.filter === k}">${v} ${count(k)}</button>`).join("")}</div>`;
  if (D.filter === "done") {
    h += `<div class="qhead">最近 3 天处理过的 · 5 秒内可以撤销，之后去 KOL 详情里看</div>` + (done.map((d) => `<div class="ghost"><span class="tag ${d.status === "done" ? "green" : ""}">${{ done: "做完", rejected: "不做", superseded: "被取代", dropped: "剔掉" }[d.status] || d.status}</span><span class="sp">${esc(d.kol_name || d.title || "")}${d.result ? " · " + esc(d.result) : ""}</span><span class="itime">${when(d.done_at)}</span></div>`).join("") || `<div class="empty">还没有</div>`);
  } else {
    h += visible.map((c) => `<button class="item ${c.id === D.sel ? "on" : ""}" type="button" data-sel="${c.id}"><div class="itop"><span class="tag ${c.status === "unknown" || c.status === "failed" ? "red" : KIND_CLS[c.kind] || ""}">${c.status === "unknown" ? "结果不明" : c.status === "failed" ? "失败" : c.feedback ? "已按意见改" : KINDS[c.kind] || c.kind}</span><span class="iname">${esc(c.kol_name || c.title || "")}</span><span class="itime">${ago(c.created_at)}</span></div><div class="isub">${esc(subOf(c))}</div></button>`).join("");
    if (!visible.length) h += `<div class="empty"><span>${cards.length ? "这一类都处理完了" : "现在没有要你决定的事"}</span>${cards.length ? `<button class="link" type="button" data-filter="all">看全部</button>` : ""}</div>`;
    if (drafting.length) h += `<div class="qhead">agent 正在写（${drafting.length}）· 写好会自动排进来</div>` + drafting.map((d) => `<div class="ghost"><span class="tag">${d.feedback ? "按意见改" : KINDS[d.kind] || "起草"}</span><span class="sp">${esc(d.kol_name || d.title || "")}</span><span class="itime">${ago(d.updated_at || d.created_at)}</span></div>`).join("");
  }
  h += `</section><article class="detail" aria-label="卡片详情">${cur ? detailHtml(cur) : `<div class="empty" style="padding:120px 24px"><span class="big">都处理完了</span><span>新来信会在几秒内出现在这里；每天早上排好下一批邀约和催信。</span></div>`}</article></div>`;
  m.innerHTML = h;
  wireDecide(m, cur, visible);
}
function stepsOf(c) {
  const a = c.action || {}, s = [];
  const code = a.code;
  if (code) {
    if (code.type === "trial_create") s.push(`在 TAFU 建体验码 ${code.code}，${code.maxUses} 次，${code.days} 天`);
    else if (code.type === "trial_extend") s.push(`在 TAFU 把 ${code.code} 延期 ${code.days} 天${code.addUses ? `，加 ${code.addUses} 次` : ""}`);
    else s.push(`在 TAFU 开活动码 ${code.code}（${code.market || ""}，粉丝 ${100 - (code.percentOff || 0)}% 价），联系邮箱 ${code.contact || ""}`);
  }
  if (c.to_addr) s.push(`${code ? "把码、次数、到期日填进信里，" : ""}从 ${c.mailbox || "发信邮箱"} ${c.in_reply_to ? "接着原邮件串" : ""}发给 ${c.to_addr}`);
  const x = a.after || {};
  const after = [];
  if (x.close_reason) after.push(`结案（${x.close_reason}）`); else if (x.stage) after.push(`阶段改为「${STAGES[x.stage] || x.stage}」`);
  if (x.never_contact) after.push("设为永不联系");
  if (x.publish_due_at) after.push(`约定发布 ${String(x.publish_due_at).slice(0, 10)}`);
  if (x.next_followup_days != null && !x.close_reason) after.push(`${x.next_followup_days} 天后提醒跟进`);
  if (after.length) s.push(after.join("，"));
  if (c.kind === "unmatched") s.push(a.match_kol_id ? `把这封信记到 KOL #${a.match_kol_id} 名下，agent 照常起草回信` : "这封信不用处理，以后同一发件人的信也不再出卡");
  if (c.kind === "bounce") s.push(a.bounce === "close" ? "这位 KOL 结案（退信或邮箱无效），原邮箱不再用" : "只解除对这个地址的拦截");
  if (c.kind === "no_reply") s.push("这封来信标为不用回，阶段不变");
  return s;
}
function headHtml(c) {
  const badges = [c.kol_stage ? STAGES[c.kol_stage] : "", c.kol_platform ? `${c.kol_platform}${c.kol_followers ? " · " + fans(c.kol_followers) + "粉" : ""}` : ""].filter(Boolean);
  return `<div class="dhead"><h1 class="h1">${esc(c.kol_name || c.title || "")}${badges.map((b) => `<span class="tag">${esc(b)}</span>`).join("")}<span class="tag ${KIND_CLS[c.kind] || ""}">${KINDS[c.kind] || c.kind}</span></h1>
    <div class="meta">${c.to_addr ? `${esc(c.mailbox || "")} → ${esc(c.to_addr)}` : esc(c.in_from || "")}${c.kol_id ? ` · <a href="#kol/${c.kol_id}">看全部资料和来往</a>` : ""}</div>
    ${c.why ? `<div class="why"><b>agent：</b>${esc(c.why)}</div>` : ""}
    ${c.status === "failed" ? `<div class="panel red" style="margin-top:10px"><span><b>同意后没做成：</b>${esc(c.result || "")}。信没有发出。</span></div>` : ""}
    ${c.status === "unknown" ? `<div class="panel red" style="margin-top:10px"><span><b>结果不明：</b>${esc(c.result || "")}。系统不会自动重做。</span></div>` : ""}
    ${c.feedback ? `<div class="edited">已按你的意见改过：「${esc(c.feedback)}」</div>` : ""}</div>`;
}

  const ro = $("#kReopen"); if (ro) ro.onclick = () => act(() => api(`/kols/${k.id}`, { fields: { stage: "replied", close_reason: null, never_contact: false, never_reason: null } }), "已重新打开，阶段回到「已回复」");

  inputs.forEach((el) => (el.oninput = el.onchange = () => ($("#kDirty").hidden = !Object.keys(changed()).length)));

    });

      <label class="row" style="font-size:14px"><input type="checkbox" id="nOk"> 她要求不再联系，或者确实不该再联系</label>
      <div class="row"><button class="btn danger" type="button" id="nGo" disabled>设为永不联系</button><button class="btn" type="button" id="nNo">取消</button><span class="hint">之后可以在这里取消</span></div>`, () => {

const JOBS = { reply: "写回信", revise: "按意见改", unmatched: "看对不上人的来信", bounce: "看退信", code_expiry: "码到期", checkin: "问发布", template: "改模板", ask: "你交代的事" };
const jobName = (j) => `${JOBS[j.kind] || j.kind}${j.kol_id ? ` · KOL #${j.kol_id}` : ""}`;
const resumeCmd = (j) => (j.agent === "codex" ? `cd ~/.kolpick/agent && codex exec resume ${j.session_id}` : `cd ~/.kolpick/agent && claude --resume ${j.session_id}`);

// ---------- 设置 ----------
const SECTIONS = [["send", "发信和额度", ["dailyLimit", "perMinute", "cooldownDays", "bounceRate", "bounceWindowDays", "bounceMinSent", "timezone"]],
  ["follow", "催信和结案", ["followup1Days", "followup2Days", "closeDays", "noFollowupLevels", "noFollowupDemands", "noFollowupChannels", "followupFrom"]],
  ["codes", "体验码和活动码", ["trialUses", "trialDays", "trialUnusedDays", "trialExpiryDays", "partnerDiscount", "partnerMarkets", "partnerMarketDefault"]],
  ["tpl", "模板", []], ["posts", "找人和找帖子", ["findCountry", "findLanguage", "postKeyword", "postLookbackDays"]], ["auto", "自动运行", []], ["local", "这台电脑", ["dataApiUrl", "feishuWebhook"]]];
const ST = { dirty: {}, editTpl: null };
async function renderSettings(m) {
  const [s, local, templates] = await Promise.all([api("/tool/settings_get", {}), api("/local"), api("/tool/templates", {})]);
  const val = (v) => (Array.isArray(v) ? v.join("、") : v && typeof v === "object" ? Object.entries(v).map(([a, b]) => `${a}=${b}`).join("、") : v ?? "");
  const field = (k) => `<label>${esc(s.labels[k] || k)}<input class="field" type="text" data-s="${k}" value="${esc(ST.dirty[k] ?? val(s.settings[k]))}"></label>`;
  const usageBy = Object.fromEntries((U.mailboxes || []).map((b) => [b.address, b]));
  const sec = route[1] || "send";
  const autoRows = [["inbox", "收信监听", "每个发信邮箱实时收信；断了自动改为每 2 分钟补收", "关掉后不再实时收信，只能手动「现在收一次」"],
    ["schedule", "定时任务", "每天：排邀约和催信、同步码用量、码到期和约好没发、找帖子、抓数据", "关掉后早上不会自动排批"],
    ["agent", "后台 agent", "来信、让它改、码到期、问发布，自动交给 agent 起草", "关掉后来信只记录，不起草"]];
  const body = {
    send: `<div class="meta">额度按人数算：同一个人一天里多发一封不再占额度。</div><div class="sgrid">${SECTIONS[0][2].map(field).join("")}</div>
      <div style="overflow-x:auto;margin-top:12px;border:1px solid var(--line2);border-radius:10px"><table class="mb"><thead><tr><th>发信邮箱</th><th>启用</th><th>今天</th><th>每天上限</th><th>预热开始</th><th>起步</th><th>每天加</th><th></th></tr></thead><tbody>
      ${s.mailboxes.map((b) => `<tr data-mb="${esc(b.address)}"><td>${esc(b.address)}</td><td><button class="sw ${b.enabled ? "on" : ""}" type="button" role="switch" aria-checked="${b.enabled}" aria-label="启用 ${esc(b.address)}" data-mtoggle></button></td><td>${usageBy[b.address] ? `${usageBy[b.address].used} / ${usageBy[b.address].limit_today}` : "—"}</td>
        <td><input class="field" style="width:80px" type="number" data-m="daily_limit" value="${b.daily_limit}"></td><td><input class="field" type="date" data-m="warmup_from" value="${b.warmup_from ? String(b.warmup_from).slice(0, 10) : ""}"></td><td><input class="field" style="width:70px" type="number" data-m="warmup_start" value="${b.warmup_start ?? ""}"></td><td><input class="field" style="width:70px" type="number" data-m="warmup_step" value="${b.warmup_step ?? ""}"></td><td><button class="btn sm" type="button" data-msave>保存</button></td></tr>`).join("")}</tbody></table></div>
      <div class="row" style="margin-top:12px"><button class="btn" type="button" id="mAdd">加一个发信邮箱</button><span class="meta">邮箱要先在飞书邮箱里开好，并让 lark-cli 有权限${S.env !== "prod" ? "；测试库只在给测试地址发信时才启用" : ""}</span></div>`,
    follow: `<div class="meta">每天早上扫一次，排成「一批」给你看。列表用顿号隔开。</div><div class="sgrid">${SECTIONS[1][2].map(field).join("")}</div>`,
    codes: `<div class="meta">agent 起草发码的信时用这些默认值；每张卡上你还能看到具体数字再同意。市场写成 台湾=TW、香港=HK。</div><div class="sgrid">${SECTIONS[2][2].map(field).join("")}</div>`,
    tpl: `<div class="meta">改在用的模板只存成新版，在「待你决定」里对比后批准才换；已排进卡片里的信不受影响。</div>
      ${templates.map((t) => `<div class="srow"><b>${esc(t.name)}<span class="meta" style="display:block;font-weight:400">${esc(t.purpose)} · ${esc((t.subject || "").slice(0, 50))}</span></b><span class="tag ${t.status === "active" ? "green" : t.status === "draft" ? "amber" : ""}">${t.status === "active" ? "在用" : t.status === "draft" ? (t.draft_of ? "新版待批准" : "草稿") : "停用"}</span><button class="btn sm" type="button" data-tedit="${t.id}">${ST.editTpl === t.id ? "收起" : "改"}</button></div>${ST.editTpl === t.id ? tplEditor(t) : ""}`).join("")}
      <div class="srow"><b>新模板</b><button class="btn sm" type="button" data-tedit="new">${ST.editTpl === "new" ? "收起" : "新建"}</button></div>${ST.editTpl === "new" ? tplEditor({ purpose: "其他" }) : ""}
      <div class="row" style="margin-top:12px"><input class="field" id="tAsk" style="flex:1;min-width:260px" type="text" placeholder="或者说怎么改，比如：邀约信再短一点；或者：新写一个「催发布」模板"><button class="btn" type="button" id="tAskGo">交给 agent</button></div>`,
    posts: `<div class="sgrid">${SECTIONS[4][2].map(field).join("")}</div><div class="meta" style="margin-top:10px">找帖子：每天看「已约发布 / 已发布 / 合作中」的人最近的帖子，含这个词就记下，第 1/3/7/30 天各抓一次数据。</div>`,
    auto: `<div class="meta">关掉只是不自动做；手动点照样能做。「暂停所有发送」在页面顶部，和这里无关。</div>${autoRows.map(([k, l, on, off]) => `<div class="srow"><b>${l}<span class="meta" style="display:block;font-weight:400">${local.auto[k] ? on : off}</span></b><button class="sw ${local.auto[k] ? "on" : ""}" type="button" role="switch" aria-checked="${!!local.auto[k]}" aria-label="${l}" data-auto="${k}"></button></div>`).join("")}
      <div class="row" style="margin-top:12px">${Object.entries(S.dailyNames || {}).map(([k, v]) => `<button class="btn sm" type="button" data-daily="${k}">现在跑：${v}${S.daily?.[k] ? `（上次 ${when(S.daily[k].at)}${S.daily[k].ok ? "" : "，出错"}）` : ""}</button>`).join("")}<button class="btn sm" type="button" id="inboxNow">现在收一次信</button></div>`,
    local: `<div class="meta">数据库连接、接口密钥、Apify token 只存在这台电脑上，页面里不显示；改要在终端里运行 <code>kolpick setup</code>。</div>
      <div class="sgrid"><label>后台 agent<select class="field" id="agKind"><option value="claude">Claude（claude -p）</option><option value="codex">Codex（codex exec）</option></select></label>
        <label>命令路径（留空 = 默认）<input class="field" type="text" id="agBin" value="${esc(local.agent.bin || "")}"></label><label>额外参数（空格隔开）<input class="field" type="text" id="agArgs" value="${esc((local.agent.args || []).join(" "))}"></label>
        <label>同时做几件（同一位 KOL 的事总是一件一件做）<input class="field" type="number" min="1" max="10" id="agPar" value="${local.agent.parallel || 3}"></label>
        <label>当前数据库<span class="field">${local.env === "prod" ? "正式库 kolpick_prod" : "测试库 kolpick_test"}</span></label><label>给 Claude / Codex 用的 MCP<span class="field">${esc(local.mcpUrl)}</span></label>
        ${SECTIONS[6][2].map(field).join("")}</div>
      <div class="row" style="margin-top:12px"><button class="btn" type="button" id="agSave">保存 agent 设置</button><span class="meta">切换数据库：在终端运行 <code>kolpick db use test</code> 或 <code>kolpick db use prod</code>，再 <code>kolpick restart</code></span></div>`,
  };
  m.innerHTML = `<div class="wrap"><div class="swrap"><nav class="smenu" aria-label="设置分组">${SECTIONS.map(([k, v]) => `<a class="${sec === k ? "on" : ""}" href="#settings/${k}">${v}</a>`).join("")}</nav>
    <div class="scontent"><section class="card"><h2 class="h2">${SECTIONS.find(([k]) => k === sec)?.[1] || ""}</h2>${body[sec] || ""}</section></div></div></div>
    ${Object.keys(ST.dirty).length ? `<div class="savebar" role="status"><span>有改动没保存</span><button class="btn" type="button" id="sDiscard">放弃</button><button class="btn primary" type="button" id="sSave">保存</button></div>` : ""}`;
  if ($("#agKind")) $("#agKind").value = local.agent.kind;
  $$("[data-s]", m).forEach((el) => (el.oninput = () => { if (el.value === String(val(s.settings[el.dataset.s]))) delete ST.dirty[el.dataset.s]; else ST.dirty[el.dataset.s] = el.value; const has = Object.keys(ST.dirty).length; if (!!$(".savebar") !== !!has) renderSettings(m).then(() => { const x = $(`[data-s="${el.dataset.s}"]`); x.focus(); x.setSelectionRange(x.value.length, x.value.length); }); }));
  const sv = $("#sSave"); if (sv) sv.onclick = () => act(async () => { for (const [key, value] of Object.entries(ST.dirty)) await api("/tool/settings_set", { key, value }); ST.dirty = {}; }, "已保存，立刻生效；排队中的信也按新规则检查");
  const sd = $("#sDiscard"); if (sd) sd.onclick = () => { ST.dirty = {}; render(); };
  $$("[data-mtoggle]", m).forEach((b) => (b.onclick = () => {
    const addr = b.closest("tr").dataset.mb, on = !b.classList.contains("on");
    act(() => api("/tool/mailbox_set", { address: addr, enabled: on }), on ? `已启用 ${addr}` : `已停用 ${addr}：排在它名下还没发的信会停住，它照常收信`);
  }));
  $$("[data-msave]", m).forEach((b) => (b.onclick = () => {
    const tr = b.closest("tr"), g = (k) => tr.querySelector(`[data-m="${k}"]`).value;
    act(() => api("/tool/mailbox_set", { address: tr.dataset.mb, daily_limit: Number(g("daily_limit")), warmup_from: g("warmup_from") || undefined, warmup_start: g("warmup_start") ? Number(g("warmup_start")) : undefined, warmup_step: g("warmup_step") ? Number(g("warmup_step")) : undefined }), "邮箱已保存");
  }));
  const ma = $("#mAdd"); if (ma) ma.onclick = () => modal(`<h2>加一个发信邮箱</h2><label class="label" style="margin:0">地址<input class="field" id="nbA" type="email" placeholder="team@tafu.me"></label><label class="label" style="margin:0">每天上限<input class="field" id="nbL" type="number" value="50"></label>
    <label class="row" style="font-size:14px"><input type="checkbox" id="nbW" checked> 预热：从每天 10 人开始，每天加 5，直到上限</label><div class="hint">加好后先是停用的；确认它能收发后再打开。</div>
    <div class="row"><button class="btn primary" type="button" id="nbGo">加上</button><button class="btn" type="button" id="nbNo">取消</button></div>`, () => {
    $("#nbNo").onclick = closeModal;
    $("#nbGo").onclick = () => { const a = $("#nbA").value.trim(); if (!a) return toast("先填地址"); closeModal(); act(() => api("/tool/mailbox_set", { address: a, enabled: false, daily_limit: Number($("#nbL").value) || 50, ...($("#nbW").checked ? { warmup_from: new Date().toISOString().slice(0, 10), warmup_start: 10, warmup_step: 5 } : {}) }), `已加上 ${a}（停用中）`); };
  });
  $$("[data-tedit]", m).forEach((b) => (b.onclick = () => { const v = b.dataset.tedit === "new" ? "new" : Number(b.dataset.tedit); ST.editTpl = ST.editTpl === v ? null : v; render(); }));
  const ts = $("#tSave"); if (ts) ts.onclick = () => { const t = templates.find((x) => x.id === ST.editTpl) || {}; act(() => api("/templates", { template_id: t.id, name: $("#tn").value, purpose: $("#tp").value, language: $("#tl").value, subject: $("#ts").value, body: $("#tb").value, why: "运营自己改的" }), "已存成新版，去待你决定里对比后批准", { link: ["去对比", "#decide"] }).then(() => (ST.editTpl = null)); };
  const tc = $("#tCancel"); if (tc) tc.onclick = () => { ST.editTpl = null; render(); };
  const ta = $("#tAskGo"); if (ta) ta.onclick = () => { const f = $("#tAsk").value.trim(); if (!f) return toast("先说怎么改"); act(() => api("/templates/ask", { feedback: f }), "已交给 agent，新版会作为模板对比卡出现在待你决定"); };
  $$("[data-auto]", m).forEach((b) => (b.onclick = () => act(() => api("/local", { auto: { [b.dataset.auto]: !local.auto[b.dataset.auto] } }), "已保存")));
  $$("[data-daily]", m).forEach((b) => (b.onclick = () => { b.disabled = true; act(() => api(`/daily/${b.dataset.daily}`, {}), (r) => (r?.ok === false ? "出错：" + (r.note || "") : "跑完了")); }));
  const ib = $("#inboxNow"); if (ib) ib.onclick = () => act(() => api("/inbox", {}), (r) => (Array.isArray(r) ? r.map((x) => `${x.mailbox}：新 ${x.recorded} 封`).join("；") || "没有新信" : "收完了"));
  const ag = $("#agSave"); if (ag) ag.onclick = () => act(() => api("/local", { agent: { kind: $("#agKind").value, bin: $("#agBin").value.trim(), args: $("#agArgs").value.trim() ? $("#agArgs").value.trim().split(/\s+/) : [], parallel: Number($("#agPar").value) || 3 } }), "已保存");
}
function tplEditor(t) {
  return `<div class="panel" style="margin:4px 0 10px"><div class="sgrid" style="margin:0"><label>名字<input class="field" id="tn" value="${esc(t.name || "")}"></label><label>用途<select class="field" id="tp">${["邀约", "催信 1", "催信 2", "发体验码", "体验码延期", "体验跟进", "体验未用", "体验到期", "发活动码", "发布确认", "其他"].map((p) => `<option ${t.purpose === p ? "selected" : ""}>${p}</option>`).join("")}</select></label><label>语言<input class="field" id="tl" value="${esc(t.language || "")}"></label></div>
    <input class="field" id="ts" value="${esc(t.subject || "")}" placeholder="主题"><textarea class="field" id="tb" rows="8">${esc(t.body || "")}</textarea>
    <div class="hint">可用占位：{稱呼}{體驗碼}{次數}{到期日}{活動碼}{專屬連結}{帳本連結}{粉絲折扣}</div>
    <div class="row"><button class="btn primary" type="button" id="tSave">存成新版，去对比</button><button class="btn" type="button" id="tCancel">取消</button></div></div>`;
}

// ---------- 启动 ----------
refresh();
setInterval(() => {
  if (document.hidden || offline || $("#modal").innerHTML) return;
  if (document.activeElement?.matches("textarea, input, select")) return;
  if (route[0] === "settings" && Object.keys(ST.dirty).length) return;
  refresh();
}, 15000);
</script>
</body>
</html>
