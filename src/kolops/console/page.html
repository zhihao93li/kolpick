<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KOL 决策台</title>
<style>
:root{--bg:#F5F6F8;--card:#FFFFFF;--line:#E3E6EB;--line2:#EEF0F3;--ink:#1A1D23;--ink2:#3B414C;--muted:#5B6270;--blue:#2457D6;--blue2:#1A3FA0;--blue-bg:#E6ECFB;--warn:#8A3D00;--warn-bg:#FDEBD8;--warn-line:#F2C9A0;--bad:#8F1D12;--bad-bg:#FBE1DE;--ok:#155C39;--ok-bg:#DDF1E6;--purple:#4B2A93;--purple-bg:#EEE7FB}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;font-size:14px;line-height:1.55}
a{color:var(--blue);text-decoration:none}a:hover{color:var(--blue2);text-decoration:underline}
button{font:inherit}
.top{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:10px 24px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.brand{font-weight:700;font-size:16px}
.tab{padding:7px 12px;border-radius:6px;color:var(--ink2);display:inline-flex;gap:6px;align-items:center}
.tab:hover{background:#ECEEF2;text-decoration:none;color:var(--ink)}
.tab.on{background:var(--blue-bg);color:var(--blue2);font-weight:600}
.cnt{font-size:12px;font-weight:600;background:var(--blue);color:#fff;border-radius:10px;padding:0 7px;line-height:20px}
.right{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
.btn{display:inline-flex;gap:8px;align-items:center;justify-content:center;min-height:36px;padding:0 14px;border-radius:7px;border:1px solid #CDD2DA;background:#fff;color:var(--ink);font-weight:500;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--bg);text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.primary:hover{background:var(--blue2)}
.btn.big{min-height:44px;padding:0 18px;font-size:15px}
.btn.sm{min-height:30px;padding:0 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.kbd{font-size:11px;line-height:18px;padding:0 5px;border-radius:4px;border:1px solid currentColor;opacity:.65;font-family:ui-monospace,Menlo,monospace}
.pill{display:inline-flex;gap:6px;align-items:center;min-height:30px;padding:0 12px;border-radius:16px;border:1px solid var(--line);background:var(--bg);color:var(--ink2);font-weight:600;font-size:13px;cursor:pointer}
.pill .dot{width:8px;height:8px;border-radius:50%;background:#1F8A55}
.pill.bad{background:var(--bad-bg);border-color:#E9B4AE;color:var(--bad)}.pill.bad .dot{background:#B42318}
.pill.warn{background:#FFF8F1;border-color:var(--warn-line);color:var(--warn)}.pill.warn .dot{background:#C2620C}
.panel{position:absolute;right:0;top:40px;width:400px;max-width:calc(100vw - 32px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(20,20,30,.14);z-index:30}
.panel .row{display:flex;gap:10px;padding:10px 14px;border-top:1px solid var(--line2);align-items:flex-start}
.banner{background:#FFF8F1;border-bottom:1px solid var(--warn-line);color:var(--warn);padding:8px 24px;font-size:13px}
main{padding:20px 24px 48px;max-width:1680px;margin:0 auto}
.narrow{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
.badge{display:inline-block;font-size:12px;line-height:20px;padding:0 8px;border-radius:4px;white-space:nowrap;background:#ECEEF2;color:var(--ink2)}
.b-blue{background:var(--blue-bg);color:var(--blue2)}.b-warn{background:var(--warn-bg);color:var(--warn)}.b-bad{background:var(--bad-bg);color:var(--bad)}.b-ok{background:var(--ok-bg);color:var(--ok)}.b-purple{background:var(--purple-bg);color:var(--purple)}
.chip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:3px 12px;font-size:13px;color:var(--ink2);cursor:pointer;min-height:30px}
.chip.on{border-color:var(--blue);color:var(--blue2);background:#EEF2FD;font-weight:600}
.bar{height:6px;background:var(--line);border-radius:3px}.bar>div{height:6px;border-radius:3px;background:#1F8A55}
.lbl{font-size:13px;color:var(--muted);font-weight:500;margin-bottom:6px}
.quote{background:var(--bg);border-radius:8px;padding:12px 16px;white-space:pre-wrap;font-size:15px}
.suggest{border:2px solid #C9D6F6;background:#F7F9FE;border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.step{display:flex;gap:12px;align-items:flex-start}
.num{flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;margin-top:1px}
.param{display:inline-flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted);margin:6px 10px 0 0}
.param span{font-size:14px;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px 10px;background:#fff;min-width:80px}
.draft{border:1px solid #CDD2DA;border-radius:8px;padding:12px 14px;white-space:pre-wrap;font-size:15px;line-height:1.75;background:#fff}
.actions{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);border-radius:0 0 12px 12px;padding:14px 28px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
details summary{cursor:pointer;color:var(--muted);font-size:13px}
.views{display:flex;gap:4px;flex-wrap:wrap;background:#ECEEF2;padding:4px;border-radius:8px;align-self:flex-start;max-width:100%}
.view{padding:7px 12px;border-radius:6px;color:var(--ink2);white-space:nowrap}
.view:hover{background:var(--line);text-decoration:none;color:var(--ink)}
.view.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.input{font:inherit;font-size:14px;color:var(--ink);border:1px solid #CDD2DA;border-radius:6px;padding:7px 10px;background:#fff}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--muted);font-weight:500;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:#FAFBFC}
td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:top}
.tone-warn{color:var(--warn);font-weight:600}.tone-bad{color:var(--bad);font-weight:600}.tone-ok{color:var(--ok)}.tone-muted{color:var(--muted)}
.two{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.them{align-self:flex-start;max-width:78%;background:#F1F2F4;border-radius:4px 14px 14px 14px;padding:10px 14px;white-space:pre-wrap}
.us{align-self:flex-end;max-width:78%;background:var(--blue-bg);border-radius:14px 4px 14px 14px;padding:10px 14px;white-space:pre-wrap}
.event{align-self:center;font-size:12px;color:var(--muted);background:#FAFBFC;border:1px solid var(--line2);border-radius:12px;padding:2px 10px;text-align:center}
.who{font-size:12px;color:var(--muted);margin-bottom:2px;white-space:normal}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line2)}
.kv span:last-child{text-align:right;word-break:break-all}
.stepper{list-style:none;margin:0;padding:0;display:flex;gap:4px;flex-wrap:wrap}
.stepper li{flex:1 1 80px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.stepper .seg{height:6px;border-radius:3px;background:var(--line)}
.err{background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:12px 14px}
.loading{padding:40px;text-align:center;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.field .input{font-size:14px}
.modal{position:fixed;inset:0;background:rgba(20,20,30,.35);display:flex;align-items:flex-start;justify-content:center;padding:60px 16px;z-index:40;overflow:auto}
.modal>div{background:#fff;border-radius:12px;padding:20px 22px;width:100%;max-width:620px;display:flex;flex-direction:column;gap:12px}
main.wide{max-width:none}
.dgrid{display:grid;grid-template-columns:minmax(300px,22%) minmax(0,1fr) minmax(380px,26%);gap:16px;align-items:start}
.dlist{position:sticky;top:64px;max-height:calc(100vh - 84px);overflow:auto;padding:6px 0}
.dgroup{font-size:12px;font-weight:600;color:var(--muted);padding:10px 14px 4px;display:flex;justify-content:space-between}
.ditem{display:flex;flex-direction:column;align-items:flex-start;gap:4px;width:100%;text-align:left;padding:9px 14px;border:0;border-left:3px solid transparent;background:transparent;font:inherit;font-size:13px;color:var(--ink);cursor:pointer}
.ditem:hover{background:var(--bg)}
.ditem.on{background:#EEF2FD;border-left-color:var(--blue)}
.dmeta{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.dtitle{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.45}
.dinfo{padding:20px 24px;display:flex;flex-direction:column;gap:16px;min-width:0}
.dact{position:sticky;top:64px;max-height:calc(100vh - 84px);overflow:auto;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.seg{display:flex;gap:0;border:1px solid #CDD2DA;border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:#fff;font:inherit;font-size:13px;padding:9px 8px;cursor:pointer;color:var(--ink2);display:flex;gap:6px;align-items:center;justify-content:center}
.seg button+button{border-left:1px solid #CDD2DA}
.seg button.on{background:#EEF2FD;color:var(--blue2);font-weight:600}
.dbuttons{display:flex;flex-wrap:wrap;gap:8px;padding-top:12px;border-top:1px solid var(--line2)}
.dbuttons{flex-direction:column}
.drow{display:flex;flex-wrap:wrap;gap:8px}
@media (max-width:1180px){.dgrid{grid-template-columns:minmax(240px,30%) minmax(0,1fr)}.dact{grid-column:2;position:static;max-height:none}}
@media (max-width:760px){.dgrid{grid-template-columns:minmax(0,1fr)}.dact{grid-column:1}.dlist{position:static;max-height:240px}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:8px;padding:10px 16px;box-shadow:0 6px 20px rgba(0,0,0,.18);font-size:14px;max-width:calc(100% - 32px)}
@media (max-width:640px){.top,main{padding-left:16px;padding-right:16px}.actions{padding:12px 16px}}
</style>
</head>
<body>
<header class="top">
  <span class="brand">KOL 决策台</span>
  <span class="muted small" id="project"></span>
  <nav aria-label="主导航" style="display:flex;gap:4px;flex-wrap:wrap">
    <a class="tab" data-tab="decide" href="#/">待你决定 <span class="cnt" id="n-decide">·</span></a>
    <a class="tab" data-tab="people" href="#/people/wait">KOL</a>
    <a class="tab" data-tab="log" href="#/log">执行记录</a>
  </nav>
  <div class="right">
    <div style="position:relative">
      <button class="pill" id="status" aria-expanded="false"><span class="dot"></span><span id="status-text">…</span></button>
      <div class="panel" id="status-panel" hidden></div>
    </div>
    <span class="muted small" id="synced"></span>
    <button class="btn sm" id="refresh">刷新</button>
    <button class="btn sm" id="pause" style="border-color:#E9B4AE;color:var(--bad)">暂停所有发送</button>
  </div>
</header>
<div class="banner" id="paused-banner" style="background:var(--bad-bg);color:var(--bad);border-color:#E9B4AE" hidden>已暂停所有发送：你同意的事会先排着，点「恢复发送」后才执行。</div>
<div class="banner" id="setup-banner" hidden></div>
<main id="app"><div class="loading">正在从飞书读数据…第一次打开或者很久没开时要一两分钟，读完会自动显示。</div></main>
<div class="toast" id="toast" hidden><span id="toast-text"></span> <button class="btn sm" id="toast-undo" style="margin-left:10px;background:transparent;color:#fff;border-color:#5B6270" hidden>撤销</button></div>
<div class="modal" id="modal" hidden><div id="modal-body"></div></div>
<script>
"use strict";
var state = { overview: null, idx: 0, handled: {}, changing: false, jobsSeen: {}, convo: {}, posted: {} };

function esc(v) {
  return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; });
}
function $(id) { return document.getElementById(id); }
function api(path, opts) {
  return fetch(path, opts).then(function (r) {
    return r.json().then(function (body) { if (!r.ok) throw new Error(body.error || ("出错了（" + r.status + "）")); return body; });
  });
}
function post(path, body) {
  return api(path, { method: "POST", headers: { "content-type": "application/json", "x-kol-console": "1" }, body: JSON.stringify(body || {}) });
}
function toast(text, undo) {
  $("toast-text").textContent = text; $("toast").hidden = false;
  var u = $("toast-undo"); u.hidden = !undo; u.onclick = function () { $("toast").hidden = true; if (undo) undo(); };
  clearTimeout(toast.t); toast.t = setTimeout(function () { $("toast").hidden = true; }, undo ? 5200 : 4000);
}
/** Hides a card at once and does the action after five seconds unless 撤销 is pressed. */
function later(id, text, action) {
  state.handled[id] = true;
  var undone = false;
  toast(text, function () { undone = true; delete state.handled[id]; renderDecide(); });
  renderDecide();
  setTimeout(function () {
    if (undone) return;
    action().then(function (r) { if (r && r.job) watchJobs(); }).catch(function (e) { delete state.handled[id]; toast("没做成：" + e.message); renderDecide(); });
  }, 5000);
}
function modal(html) { $("modal-body").innerHTML = html; $("modal").hidden = false; }
function closeModal() { $("modal").hidden = true; }
$("modal").addEventListener("click", function (e) { if (e.target === $("modal")) closeModal(); });
function fail(err) { $("app").innerHTML = '<div class="narrow"><div class="err">' + esc(err.message || err) + '</div></div>'; }
function timeOf(ms) { var d = new Date(ms); return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }

function loadOverview() {
  return api("/api/overview").then(function (o) {
    state.overview = o;
    $("project").textContent = o.project;
    $("n-decide").textContent = o.cards.length;
    $("synced").textContent = "飞书 " + timeOf(o.loadedAt) + " 已同步";
    renderStatus(o.status, o.jobs);
    renderPause(o.paused);
    $("setup-banner").hidden = !(o.setupNeeded && o.setupNeeded.length);
    if (o.setupNeeded && o.setupNeeded.length) $("setup-banner").textContent = "这个项目的飞书表还缺 " + o.setupNeeded.join("、") + "，决策台现在只能看。请在执行电脑上运行 kol setup-base，然后重新打开决策台。";
    o.jobs.forEach(function (j) { state.jobsSeen[j.id] = j.state; });
    if (o.jobs.some(function (j) { return j.state === "排队中" || j.state === "进行中"; })) watchJobs();
    return o;
  });
}

function renderPause(on) {
  state.paused = on;
  $("pause").textContent = on ? "恢复发送" : "暂停所有发送";
  $("paused-banner").hidden = !on;
}
$("pause").addEventListener("click", function () {
  var on = !state.paused;
  if (on && !confirm("暂停后，所有发信都会停下，已同意的事先排着。确定暂停吗？")) return;
  post("/api/pause", { on: on }).then(function (r) { renderPause(r.paused); toast(r.paused ? "已暂停所有发送" : "已恢复发送"); }).catch(function (e) { toast("没做成：" + e.message); });
});
var jobTimer = null;
function watchJobs() {
  if (jobTimer) return;
  jobTimer = setInterval(function () {
    api("/api/jobs").then(function (r) {
      var busy = false;
      r.jobs.forEach(function (j) {
        var was = state.jobsSeen[j.id];
        if ((j.state === "做完了" || j.state === "没做成") && was && was !== j.state) toast((j.state === "做完了" ? "做完了：" : "没做成：") + j.what + (j.note ? "（" + j.note + "）" : ""));
        state.jobsSeen[j.id] = j.state;
        if (j.state === "排队中" || j.state === "进行中") busy = true;
      });
      if (state.overview) { state.overview.jobs = r.jobs; renderStatus(state.overview.status, r.jobs); }
      if (!busy) { clearInterval(jobTimer); jobTimer = null; }
    }).catch(function () {});
  }, 3000);
}
function renderStatus(s, jobs) {
  jobs = jobs || [];
  var recent = jobs.filter(function (j) { return Date.now() - j.at < 30 * 60 * 1000 || j.state === "排队中" || j.state === "进行中"; });
  var busy = recent.filter(function (j) { return j.state === "排队中" || j.state === "进行中"; }).length;
  var failedJobs = recent.filter(function (j) { return j.state === "没做成"; }).length;
  var failed = s.failed + failedJobs, running = s.running + busy;
  var pill = $("status");
  pill.className = "pill" + (failed ? " bad" : running ? " warn" : "");
  $("status-text").textContent = state.paused && running ? ("已暂停 · " + running + " 件排着") : failed ? (failed + " 件没做成" + (running ? " · 执行中 " + running : "")) : running ? ("执行中 " + running) : "都做完了";
  var jobRows = recent.map(function (j) {
    var cls = j.state === "没做成" ? "b-bad" : j.state === "做完了" ? "b-ok" : "b-warn";
    return '<div class="row"><span class="badge ' + cls + '">' + esc(j.state) + '</span><div style="flex:1;min-width:0"><div style="font-weight:500">' + esc(j.what) + '</div>' +
      (j.note ? '<div class="muted tiny">' + esc(j.note) + '</div>' : "") + '</div>' + (j.person ? '<a class="tiny" href="#/person/' + esc(j.person) + '">看</a>' : "") + '</div>';
  }).join("");
  var rows = jobRows + s.items.map(function (i) {
    var cls = i.st === "没做成" ? "b-bad" : i.st === "进行中" ? "b-warn" : "b-blue";
    return '<div class="row"><span class="badge ' + cls + '">' + esc(i.st) + '</span><div style="flex:1;min-width:0"><div style="font-weight:500">' + esc(i.text) + '</div>' +
      (i.note ? '<div class="muted tiny">' + esc(i.note) + '</div>' : "") + '</div>' + (i.person ? '<a class="tiny" href="#/person/' + esc(i.person) + '">看</a>' : "") + '</div>';
  }).join("");
  $("status-panel").innerHTML = '<div style="display:flex;justify-content:space-between;padding:12px 14px 8px"><b>后台在做的事</b><a href="#/log" class="small">全部执行记录</a></div>' +
    (rows || '<div class="row muted">没有在做的事</div>');
}
$("status").addEventListener("click", function () {
  var p = $("status-panel"); p.hidden = !p.hidden; $("status").setAttribute("aria-expanded", String(!p.hidden));
});
document.addEventListener("click", function (e) {
  if (!e.target.closest || e.target.closest("#status") || e.target.closest("#status-panel")) return;
  $("status-panel").hidden = true;
});
$("refresh").addEventListener("click", function () {
  var b = $("refresh"); b.disabled = true; b.textContent = "刷新中…";
  post("/api/refresh").then(loadOverview).then(route).catch(fail).then(function () { b.disabled = false; b.textContent = "刷新"; });
});

// --- 待你决定 ---
var GROUPS = ["出了问题", "发布", "回信", "来信", "邀约和决定", "模板", "其他"];
var TAG = { problem: "b-bad", overdue: "b-warn", reply: "b-blue", mail: "b-purple", unknown: "b-purple", batch: "b-warn", template: "", todo: "" };

function visibleCards() {
  return state.overview.cards.filter(function (c) { return !state.handled[c.id]; });
}
function draftText(c) {
  var ta = $("draft-body");
  if (!ta) return null;
  var body = ta.value.trim();
  return c.draft.subject ? "主题：" + c.draft.subject + "\n" + body : body;
}
function cardEdits(c) {
  var edits = {};
  if (c.draft && $("draft-body") && $("draft-body").value.trim() !== c.draft.body.trim()) edits["邮件草稿"] = draftText(c);
  Array.prototype.forEach.call(document.querySelectorAll("[data-field]"), function (el) {
    var orig = el.getAttribute("data-orig"), v = el.value.trim();
    if (v && v !== orig && v.charAt(0) !== "（") edits[el.getAttribute("data-field")] = v;
  });
  return edits;
}
function who(c) { return c.who ? c.who.name : c.headline; }

function actionsFor(c) {
  if (c.kind === "mail") return [
    { label: "不用回", key: "D", primary: true, run: function () { later(c.id, "已标成不用回：" + who(c), function () { return post("/api/mail-done", { id: c.id.slice(5) }); }); } },
    { label: "标成永不联系", key: "N", danger: true, run: function () { if (confirm("以后这个项目不再联系 " + who(c) + "，确定吗？")) later(c.id, "已标成永不联系：" + who(c), function () { return post("/api/mail-never", { id: c.id.slice(5) }); }); } },
  ];
  if (c.kind === "unknown") return [
    { label: "关联到 KOL", key: "L", primary: true, run: function () { linkMail(c); } },
    { label: "跟 KOL 无关", key: "D", run: function () { later(c.id, "已归档：" + c.headline, function () { return post("/api/mail-done", { id: c.id.slice(8) }); }); } },
  ];
  if (c.kind === "overdue" && state.posted[c.id]) return [
    { label: "记下这条发布", key: "A", primary: true, run: function () {
      var link = ($("post-link") || {}).value || "";
      if (!/^https?:\/\//.test(link.trim())) { toast("先把帖子链接贴在上面的框里"); return; }
      later(c.id, "已记下发布：" + who(c), function () { return post("/api/post", { id: c.who.id, link: link.trim() }); });
    } },
  ];
  if (c.kind === "overdue") return [
    { label: "发信问她", key: "A", primary: true, run: function () {
      var subject = ($("draft-subject") || {}).value || "", body = ($("draft-body") || {}).value || "";
      if (!body.trim()) { toast("先把信写好"); return; }
      if (body.indexOf("{") >= 0) { toast("信里还有 { } 占位符，换成实际的字再发"); return; }
      var next = new Date(Date.now() + 3 * 86400000);
      var nextDay = next.getFullYear() + "-" + String(next.getMonth() + 1).padStart(2, "0") + "-" + String(next.getDate()).padStart(2, "0");
      later(c.id, "已排队发信给 " + who(c), function () {
        return post("/api/write", { id: c.who.id, subject: subject, body: body }).then(function (r) {
          return post("/api/followup", { id: c.who.id, fields: { 下一步: "问了发布时间，等她回", 下次跟进日期: nextDay, 当前轮到谁: "KOL" } }).then(function () { return r; });
        });
      });
    } },
  ];
  if (c.kind === "todo") return [
    { label: "做完了", key: "A", primary: true, run: function () { later(c.id, "已标成做完了：" + c.headline, function () { return post("/api/todo-done", { id: c.id }); }); } },
    { label: "不用做了", key: "D", run: function () { later(c.id, "这件事不做了：" + c.headline, function () { return post("/api/drop", { id: c.id, note: "" }); }); } },
  ];
  if (c.kind === "problem") return [
    { label: "我处理好了", key: "A", primary: true, run: function () { later(c.id, "已标成处理好了", function () { return post("/api/problem-done", { id: c.id }); }); } },
  ];
  var dropIt = { label: "不做了", key: "D", run: function () {
    if (!confirm("这件事不做了，会从队列里撤掉。确定吗？")) return;
    later(c.id, "这件事不做了：" + who(c), function () { return post("/api/drop", { id: c.id, note: "" }); });
  } };
  var toClaude = { label: "让 Claude 改", key: "E", run: function () { state.changing = true; renderDecide(); var n = $("change-note"); if (n) n.focus(); } };
  if (c.send && c.send.byHand) return [
    { label: "我发出去了", key: "A", primary: true, run: function () {
      var edits = cardEdits(c);
      later(c.id, "已记下：你手动发给了 " + who(c), function () { return post("/api/sent-by-hand", { id: c.id, edits: edits }); });
    } },
    { label: "复制信", key: "C", run: function () { copyDraft(c); } },
    toClaude, dropIt,
  ];
  return [
    { label: c.send ? "同意，发出去" : "同意", key: "A", primary: true, run: function () {
      var edits = cardEdits(c);
      later(c.id, c.send ? "已同意：" + who(c) + "，5 秒后开始发" : "已同意：" + who(c), function () { return post("/api/approve", { id: c.id, edits: edits }); });
    } },
    toClaude, dropIt,
  ];
}

function copyDraft(c) {
  var body = ($("draft-body") || {}).value || c.draft.body;
  var all = "收件人：" + (c.send.to || "") + "\n" + (c.draft.subject ? "主旨：" + c.draft.subject + "\n" : "") + "\n" + body;
  navigator.clipboard.writeText(all).then(function () { toast("已复制收件人、主旨和正文"); }, function () { toast("复制不了，请在信里全选后手动复制"); });
}

function linkMail(c) {
  modal('<h2 style="margin:0;font-size:18px">这是哪位 KOL 的？</h2><div class="muted small">' + esc(c.headline) + '</div>' +
    '<input class="input" id="l-q" placeholder="搜名字、账号、邮箱"><div id="l-list" class="small"></div>' +
    '<div style="display:flex;justify-content:flex-end"><button class="btn" id="l-cancel">取消</button></div>');
  $("l-cancel").onclick = closeModal;
  var t = null;
  $("l-q").oninput = function () {
    clearTimeout(t);
    var q = $("l-q").value.trim();
    t = setTimeout(function () {
      if (!q) { $("l-list").innerHTML = ""; return; }
      api("/api/people?view=all&q=" + encodeURIComponent(q)).then(function (r) {
        $("l-list").innerHTML = r.rows.slice(0, 8).map(function (x) {
          return '<div style="display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line2)"><span><b>' + esc(x.handle) + '</b> <span class="muted">' + esc(x.sub) + '</span></span><button class="btn sm" data-pick="' + esc(x.id) + '">就是她</button></div>';
        }).join("") || '<div class="muted" style="padding:8px 0">没找到，换个关键词</div>';

          b.onclick = function () {
            closeModal();

          };
        });
      });

}

function newsBlock() {
  var n = state.news;
  if (!n || (!n.chips.length && !n.items.length)) return "";
  var chips = n.chips.map(function (c) { return '<span class="badge ' + (c.tone === "ok" ? "b-ok" : "") + '">' + esc(c.label) + " " + c.n + "</span>"; }).join(" ");
  var items = n.items.map(function (i) {
    return '<div style="display:flex;gap:12px;padding:6px 0;border-top:1px solid var(--line2)"><span class="muted tiny" style="width:120px;flex:0 0 auto">' + esc(i.when) + '</span><span style="flex:1">' + esc(i.text) + '</span>' +
      (i.link ? '<a class="tiny" href="' + esc(i.link) + '" target="_blank" rel="noopener">帖子 ↗</a>' : "") + (i.person ? '<a class="tiny" href="#/person/' + esc(i.person) + '">看</a>' : "") + '</div>';
  }).join("");
  return '<details class="card" style="padding:10px 16px"' + (visibleCards().length ? "" : " open") + '><summary style="font-size:14px;color:var(--ink)"><b>你不在时发生的</b> <span class="muted small">' + esc(n.since) + ' 以后 · 不用你处理</span> ' + chips + '</summary>' + items + '</details>';
}

function convoHtml(p) {
  var list = p.bubbles.slice(-4).map(function (b) {
    if (b.side === "event") return '<div class="event">' + esc(b.when.slice(0, 10) + " · " + b.text) + "</div>";
    return '<div class="' + b.side + '"><div class="who">' + esc(b.who + " · " + b.when) + "</div>" + esc(b.text.length > 220 ? b.text.slice(0, 220) + "…" : b.text) + "</div>";
  }).join("");
  return list ? '<div style="display:flex;flex-direction:column;gap:8px">' + list + "</div>" : '<div class="muted small">还没有来往</div>';
}
function loadConvo(fid) {
  var box = $("convo");
  if (!box) return;
  var cached = state.convo[fid];
  if (cached) { box.innerHTML = convoHtml(cached); return; }
  box.innerHTML = '<div class="muted small">读取最近的来往…</div>';
  api("/api/person?id=" + encodeURIComponent(fid)).then(function (p) {
    state.convo[fid] = p;
    var now = $("convo");
    if (now && now.getAttribute("data-fid") === fid) now.innerHTML = convoHtml(p);
  }).catch(function () { var now = $("convo"); if (now) now.innerHTML = '<div class="muted small">读不到来往记录</div>'; });
}

function renderDecide() {
  var o = state.overview, cards = visibleCards();
  if (state.idx >= cards.length) state.idx = Math.max(0, cards.length - 1);
  var c = cards[state.idx];
  $("n-decide").textContent = cards.length;
  var oldList = document.querySelector(".dlist");
  var listScroll = oldList ? oldList.scrollTop : 0;
  var top = '<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:baseline"><b style="font-size:16px">' + (cards.length ? "有 " + cards.length + " 件要你决定" : "没有要你决定的事") + '</b>' +
    '<span class="muted small">J / K 上一件 · 下一件</span></div>' +
    (o.waitingClaude ? '<div class="muted small">另有 ' + o.waitingClaude + ' 件在等 Claude 按你的意见重写（在 Claude 里说「改退回的草稿」），写好会排进来。</div>' : "") + '<div id="news">' + newsBlock() + '</div>';
  if (!c) {
    $("app").innerHTML = '<div class="narrow">' + top + '<section class="card" style="padding:48px 24px;text-align:center"><div style="font-size:22px;font-weight:700">现在没有要你决定的事</div><div class="muted">同意的事在后台执行，结果看右上角。新来信和 Claude 准备好的草稿会自动排进来。</div></section></div>';
    return;
  }

  // --- 左：列表 ---
  var list = "", lastGroup = "";
  cards.forEach(function (x, i) {
    if (x.group !== lastGroup) {
      var n = cards.filter(function (y) { return y.group === x.group; }).length;
      list += '<div class="dgroup">' + esc(x.group) + ' <span>' + n + '</span></div>';
      lastGroup = x.group;
    }
    list += '<button class="ditem' + (i === state.idx ? " on" : "") + '" data-i="' + i + '"><span class="badge ' + (TAG[x.kind] || "") + '">' + esc(x.tag) + '</span><span class="dtitle">' + esc(x.headline) + '</span>' + (x.meta ? '<span class="dmeta">' + esc(x.meta) + '</span>' : "") + '</button>';
  });

  // --- 中：信息 ---
  var info = '<div><div class="small" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="badge ' + (TAG[c.kind] || "") + '">' + esc(c.tag) + '</span>' +
      (c.who ? '<a href="#/person/' + esc(c.who.id) + '">' + esc(c.who.name) + '</a>' : "") + '<span class="muted">' + esc(c.meta) + '</span></div>' +
      '<h1 style="margin:6px 0 0;font-size:22px;line-height:1.4">' + esc(c.headline) + '</h1></div>' +
    (c.mail ? '<div><div class="lbl">' + esc(c.mail.label) + (c.mail.when ? " · " + esc(c.mail.when) : "") + '</div><div class="quote">' + esc(c.mail.text) + '</div></div>' : "") +
    '<div class="suggest"><div class="lbl" style="color:var(--blue2);margin:0">建议</div><div style="font-size:17px;font-weight:600">' + esc(c.suggest) + '</div>' +
      (c.why ? '<div class="muted small" style="white-space:pre-wrap">' + esc(c.why) + '</div>' : "") + '</div>' +
    (c.who ? '<div><div style="display:flex;justify-content:space-between;gap:8px"><span class="lbl">最近的来往</span><a class="small" href="#/person/' + esc(c.who.id) + '">看全部</a></div><div id="convo" data-fid="' + esc(c.who.id) + '"></div></div>' : "");

  // --- 右：操作 ---
  var steps = c.steps.map(function (s, i) {
    var params = (s.params || []).map(function (p) {
      var editable = c.kind === "reply" && p.field;
      return '<label class="param">' + esc(p.label) + (editable ? '<input class="input" style="width:120px;padding:4px 8px" data-field="' + esc(p.field) + '" data-orig="' + esc(p.value) + '" value="' + esc(p.value) + '">' : '<span>' + esc(p.value) + '</span>') + '</label>';
    }).join("");
    return '<div class="step"><span class="num">' + (i + 1) + '</span><div style="flex:1;min-width:0"><div>' + esc(s.text) + '</div>' + (params ? "<div>" + params + "</div>" : "") + '</div></div>';
  }).join("");
  var acts = actionsFor(c);
  var moreActs = acts.slice(1);
  var buttons = '<button class="btn big primary" data-act="0">' + esc(acts[0].label) + ' <span class="kbd">' + acts[0].key + '</span></button>' +
    '<div class="drow">' + moreActs.map(function (a, i) {
      return '<button class="btn"' + (a.danger ? ' style="border-color:#E9B4AE;color:var(--bad)"' : "") + ' data-act="' + (i + 1) + '">' + esc(a.label) + ' <span class="kbd">' + a.key + '</span></button>';
    }).join("") + '<button class="btn" id="skip" title="先放着，看下一件">跳过 <span class="kbd">S</span></button></div>';
  var posted = c.kind === "overdue" && state.posted[c.id];
  var choice = c.kind === "overdue" ? '<div class="field" style="color:var(--ink);font-weight:500">她发了吗？<div class="seg" role="radiogroup">' +
      '<button role="radio" aria-checked="' + !posted + '" class="' + (posted ? "" : "on") + '" data-path="notyet">还没发：写信问她 <span class="kbd">1</span></button>' +
      '<button role="radio" aria-checked="' + !!posted + '" class="' + (posted ? "on" : "") + '" data-path="posted">已经发了：记下链接 <span class="kbd">2</span></button></div></div>' : "";
  var linkBox = posted ? '<label class="field">帖子链接<input class="input" id="post-link" placeholder="https://"><span class="tiny">记下后她会移到「已发布」，之后自动记播放和互动</span></label>' : "";
  var draft = c.draft && !posted ? '<div style="display:flex;flex-direction:column;gap:6px"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px"><span class="lbl" style="margin:0">' + esc(c.draft.label) + '</span>' + (c.kind === "reply" ? '<span class="muted tiny">可以直接改字</span>' : "") + '</div>' +
      (c.kind === "overdue" ? '<label class="field">主旨（她回过我们的信就可以不填）<input class="input" id="draft-subject" value="' + esc(c.draft.subject) + '"></label>'
        : c.draft.subject ? '<div class="muted small">主旨：' + esc(c.draft.subject) + '</div>' : "") +
      (c.kind === "reply" || c.kind === "overdue" ? '<textarea class="input draft" id="draft-body" rows="10" style="resize:vertical;font-size:14px" placeholder="写给她的信">' + esc(c.draft.body) + '</textarea>' : '<div class="draft" style="font-size:14px">' + esc(c.draft.body) + '</div>') +
      (c.draft.note ? '<div class="muted tiny">' + esc(c.draft.note) + '</div>' : "") + '</div>' : "";
  var mailHint = c.kind === "mail" ? '<div class="muted small">要回信的话：在 Claude 里说「处理来信」，写好的草稿会排进这里。</div>' : "";
  var changing = state.changing && ["reply", "batch", "template"].indexOf(c.kind) >= 0;
  var next = cards[state.idx + 1];
  if (c.kind === "overdue") steps = "";
  var after = c.send && c.send.byHand ? "这封要你自己发：" : c.kind === "reply" || c.kind === "batch" || c.kind === "template" ? "点「" + acts[0].label + "」后会：" : "可以这样处理：";
  var actionPane = changing
    ? '<div style="display:flex;flex-direction:column;gap:12px"><b style="font-size:16px">让 Claude 改</b>' +
      '<label class="field" style="color:var(--ink)">哪里要改？<textarea class="input" id="change-note" rows="4" placeholder="比如：语气轻一点，不要提分润比例；或者：不要结案，改成下个月再问"></textarea></label>' +
      '<button class="btn big primary" id="to-claude">交给 Claude 重写</button><button class="btn" id="cancel-change">返回</button>' +
      '<div class="muted tiny">交给 Claude 后，这件先离开队列。在 Claude 里说「改退回的草稿」，改好的会排回这里，你再看一遍。</div>' +
      (c.draft ? '<div><div class="lbl">现在的草稿</div><div class="draft" style="font-size:13px;max-height:320px;overflow:auto">' + esc(c.draft.body) + '</div></div>' : "") + '</div>'
    : choice + (steps ? '<div style="display:flex;flex-direction:column;gap:10px"><div class="lbl" style="margin:0">' + esc(after) + '</div>' + steps + '</div>' : "") +
      linkBox + draft + mailHint +
      '<div class="dbuttons">' + buttons + '</div>' +
      (c.kind === "reply" ? '<div class="muted tiny">小改动直接在信里改，再点「' + esc(acts[0].label) + '」；要大改就「让 Claude 改」。</div>' : "") +
      '<div class="muted tiny">' + (next ? "下一件：" + esc(next.headline) : "这是最后一件") + '</div>';

  $("app").innerHTML = '<div style="display:flex;flex-direction:column;gap:12px">' + top +
    '<div class="dgrid">' +
      '<nav class="card dlist" aria-label="待你决定的事">' + list + '</nav>' +
      '<section class="card dinfo" aria-label="这件事">' + info + '</section>' +
      '<section class="card dact" aria-label="怎么处理">' + actionPane + '</section>' +
    '</div></div>';

  var newList = document.querySelector(".dlist");
  if (newList) newList.scrollTop = listScroll;
  var on = document.querySelector(".ditem.on");
  if (on && newList && (on.offsetTop < newList.scrollTop || on.offsetTop > newList.scrollTop + newList.clientHeight - 60)) newList.scrollTop = on.offsetTop - 80;
  Array.prototype.forEach.call(document.querySelectorAll("[data-i]"), function (b) {
    b.addEventListener("click", function () { state.idx = Number(b.getAttribute("data-i")); state.changing = false; renderDecide(); });
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-act]"), function (b) { b.addEventListener("click", function () { acts[Number(b.getAttribute("data-act"))].run(); }); });
  if ($("skip")) $("skip").addEventListener("click", function () { move(1); });
  if (changing) {
    $("cancel-change").addEventListener("click", function () { state.changing = false; renderDecide(); });
    $("to-claude").addEventListener("click", function () {
      var note = $("change-note").value.trim();
      if (!note) { toast("写一句哪里要改，Claude 才知道怎么改"); return; }
      state.changing = false;
      later(c.id, "已交给 Claude 重写：" + who(c), function () { return post("/api/revise", { id: c.id, note: note }); });
    });
  }
  Array.prototype.forEach.call(document.querySelectorAll("[data-path]"), function (b) {
    b.addEventListener("click", function () { state.posted[c.id] = b.getAttribute("data-path") === "posted"; renderDecide(); if ($("post-link")) $("post-link").focus(); });
  });
  if (c.who) loadConvo(c.who.id);
}
function move(d) {
  var n = visibleCards().length;
  if (!n) return;
  state.idx = (state.idx + d + n) % n;
  state.changing = false;
  renderDecide();
  window.scrollTo(0, 0);
}
document.addEventListener("keydown", function (e) {
  if (location.hash && location.hash !== "#/" && location.hash !== "#") return;
  if (!$("modal").hidden) return;
  // While writing what Claude should change, only Esc (back) works.
  if (state.changing) { if (e.key === "Escape") { state.changing = false; renderDecide(); } return; }
  if (e.target.closest && e.target.closest("input,textarea,select")) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  var k = e.key.toLowerCase();
  var cur = visibleCards()[state.idx];
  if (cur && cur.kind === "overdue" && (k === "1" || k === "2")) { state.posted[cur.id] = k === "2"; renderDecide(); return; }
  if (k === "j" || k === "s") return move(1);
  if (k === "k") return move(-1);
  var c = visibleCards()[state.idx];
  if (!c) return;
  var acts = actionsFor(c);
  var hit = acts.find(function (a) { return a.key.toLowerCase() === k; });
  if (hit) { e.preventDefault(); hit.run(); }
});

// --- KOL ---
var searchTimer = null;
function renderPeople(view, q) {
  var o = state.overview;
  var tabs = o.views.map(function (v) {
    return '<a class="view' + (v.key === view ? " on" : "") + '" href="#/people/' + v.key + '">' + esc(v.label) + ' <span class="muted tiny">' + (o.counts[v.key] || 0) + '</span></a>';
  }).join("");
  $("app").innerHTML = '<div style="display:flex;flex-direction:column;gap:12px">' +
    '<div style="display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline"><h1 style="margin:0;font-size:22px">KOL</h1>' +
      '<span class="muted">正在跟进 ' + (o.counts.all || 0) + ' 位 · 还没联系过 ' + (o.counts.pool || 0) + ' 位</span>' +
      '<button class="btn primary" style="margin-left:auto" id="find">找新人</button></div>' +
    '<div class="views" role="tablist">' + tabs + '</div>' +
    '<div class="muted small" id="question"></div>' +
    '<input class="input" id="q" placeholder="搜名字、账号、邮箱" value="' + esc(q) + '" style="max-width:360px">' +
    '<section class="card" style="overflow-x:auto" id="table"><div class="loading">读取中…</div></section></div>';
  $("find").addEventListener("click", openFind);
  var input = $("q");
  input.addEventListener("input", function () {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () { loadPeople(view, input.value); }, 300);
  });
  loadPeople(view, q);
}
function cell(c) {
  var cls = c.tone ? "tone-" + c.tone : "";
  var body = esc(c.v);
  if (c.badge) body = '<span class="badge ' + (c.tone === "bad" ? "b-bad" : c.tone === "warn" ? "b-warn" : "") + '">' + body + "</span>";
  if (c.link === "decide") body = '<a href="#/" style="text-decoration:none">' + body + "</a>";
  else if (c.link) body = '<a href="' + esc(c.link) + '" target="_blank" rel="noopener">' + body + " ↗</a>";
  return '<td class="' + cls + '">' + body + "</td>";
}
function loadPeople(view, q) {
  api("/api/people?view=" + encodeURIComponent(view) + "&q=" + encodeURIComponent(q || "")).then(function (r) {
    $("question").textContent = r.question;
    var head = "<tr><th>KOL</th>" + r.columns.map(function (c) { return "<th>" + esc(c) + "</th>"; }).join("") + "</tr>";
    var rows = r.rows.map(function (x) {
      var who = x.hasDetail ? '<a href="#/person/' + esc(x.id) + '" style="font-weight:500">' + esc(x.handle) + "</a>" : '<span style="font-weight:500">' + esc(x.handle) + "</span>";
      return '<tr><td style="white-space:nowrap">' + who + '<div class="muted tiny">' + esc(x.sub) + "</div></td>" + x.cells.map(cell).join("") + "</tr>";
    }).join("");
    $("table").innerHTML = '<table style="min-width:760px"><thead>' + head + "</thead><tbody>" + (rows || '<tr><td colspan="9" class="muted">这里没有人</td></tr>') + "</tbody></table>" +
      '<div class="muted small" style="padding:10px 12px">' + (r.total > r.rows.length ? "一共 " + r.total + " 位，只显示前 " + r.rows.length + " 位，可以用上面的搜索。" : "一共 " + r.total + " 位") + "</div>";
  }).catch(function (e) { $("table").innerHTML = '<div class="err">' + esc(e.message) + "</div>"; });
}

function openFind() {
  modal('<div class="loading">读取入库批次…</div>');
  api("/api/find-options").then(function (r) {
    var opts = r.batches.slice().reverse().map(function (b) { return '<option value="' + esc(b) + '"></option>'; }).join("");
    modal('<h2 style="margin:0;font-size:18px">找一批新的 KOL</h2><div class="muted small">去 Instagram / YouTube 上搜，查他们公开的邮箱，到你设的上限就停。找到的人进「还没联系过」，已经在库里的会跳过。</div>' +
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px">' +
      '<label class="field">在哪个平台找<select class="input" id="f-platform"><option value="instagram">Instagram</option><option value="youtube">YouTube</option><option value="tiktok">TikTok（只能查已知账号）</option></select></label>' +
      '<label class="field">找什么样的人（关键词，逗号隔开）<input class="input" id="f-keywords" placeholder="伴侶, 感情, 兩性"></label>' +
      '<label class="field">或者：找像这几位的人<input class="input" id="f-seeds" placeholder="@love.notes.tw, @couple.daily"></label>' +
      '<label class="field">粉丝数<span style="display:flex;gap:6px;align-items:center"><input class="input" id="f-min" style="width:100px" value="5000"> 到 <input class="input" id="f-max" style="width:100px" value="50000"></span></label>' +
      '<label class="field">大约搜多少个账号<input class="input" id="f-target" value="100"><span class="tiny">有公开邮箱的通常是其中三到四成</span></label>' +
      '<label class="field">最多花多少（美元）<input class="input" id="f-budget" value="5"><span class="tiny">到上限就停，已经找到的照样入库</span></label>' +
      '<label class="field">放进哪个入库批次<input class="input" id="f-batch" list="f-batches" placeholder="选一个，或者写个新名字"><datalist id="f-batches">' + opts + '</datalist><span class="tiny">写新名字的话，会在飞书「入库批次」里加上这个选项</span></label></div>' +
      '<div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" id="f-cancel">取消</button><button class="btn primary" id="f-go">开始找</button></div>');
    $("f-cancel").onclick = closeModal;
    $("f-go").onclick = function () {
      var req = { platform: $("f-platform").value, keywords: $("f-keywords").value, seeds: $("f-seeds").value, minFollowers: $("f-min").value, maxFollowers: $("f-max").value, budget: $("f-budget").value, batch: $("f-batch").value.trim(), target: $("f-target").value };
      if (!req.batch) { toast("写一个入库批次"); return; }
      var isNew = r.batches.indexOf(req.batch) < 0;
      if (!confirm((isNew ? "「" + req.batch + "」是新批次，会在飞书「入库批次」里加上这个选项。\n" : "") + "大约搜 " + req.target + " 个账号，最多花 $" + req.budget + "。开始找吗？")) return;
      post("/api/find", req).then(function () { closeModal(); toast("开始找了，进度看右上角；找完会出现在「还没联系过」"); watchJobs(); }).catch(function (e) { toast("没开始：" + e.message); });
    };
  }).catch(function (e) { modal('<div class="err">' + esc(e.message) + '</div><button class="btn" onclick="closeModal()">关闭</button>'); });
}

// --- 一位 KOL ---
function renderPerson(id, all) {
  $("app").innerHTML = '<div class="loading">读取她的来往记录…</div>';
  api("/api/person?id=" + encodeURIComponent(id) + (all ? "&all=1" : "")).then(function (p) {
    var stepper = p.stageStep >= 0 ? '<ol class="stepper" aria-label="合作进度">' + p.stages.map(function (s, i) {
      var color = i < p.stageStep ? "#1F8A55" : i === p.stageStep ? "var(--blue)" : "var(--line)";
      return '<li><div class="seg" style="background:' + color + '"></div><span style="' + (i === p.stageStep ? "font-weight:600" : i > p.stageStep ? "color:var(--muted)" : "") + '">' + esc(s) + (i === p.stageStep ? "（现在）" : "") + "</span></li>";
    }).join("") + "</ol>" : '<div><span class="badge">' + esc(p.stage) + "</span></div>";
    var pending = p.pending.map(function (r) {
      return '<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:#FFF8F1;border:1px solid var(--warn-line);border-radius:10px;padding:12px 14px">' +
        '<div style="flex:1 1 240px"><div style="font-weight:600">有 1 件事等你决定：' + esc(r.title) + '</div><div class="muted small">' + esc(r.ask) + '</div></div><a class="btn primary" href="#/">去看</a></div>';
    }).join("");
    var bubbles = p.bubbles.map(function (b) {
      if (b.side === "event") {
        return b.full ? '<details class="event" style="max-width:90%;text-align:left"><summary>' + esc(b.when.slice(0, 10) + " · " + b.text) + '（点开看全文）</summary><div style="white-space:pre-wrap;font-size:13px;color:var(--ink);margin-top:6px">' + esc(b.full) + "</div></details>"
          : '<div class="event">' + esc(b.when.slice(0, 10) + " · " + b.text) + "</div>";
      }
      return '<div class="' + b.side + '"><div class="who">' + esc(b.who + " · " + b.when) + "</div>" + esc(b.text) +
        (b.summaryOnly ? '<div class="who" style="margin-top:4px">只有摘要，原文在邮箱里</div>' : "") + "</div>";
    }).join("");
    var trial = p.trial ? '<div style="display:flex;justify-content:space-between"><b>体验码 ' + esc(p.trial.code) + '</b><span class="muted small">' + esc(p.trial.expires) + ' 到期</span></div>' +
      (p.trial.max ? '<div class="bar" role="img" aria-label="用了 ' + p.trial.used + ' 次，共 ' + p.trial.max + ' 次"><div style="width:' + Math.min(100, Math.round(p.trial.used / p.trial.max * 100)) + '%;background:var(--blue)"></div></div><div class="muted small">用了 ' + p.trial.used + ' 次，共 ' + p.trial.max + ' 次</div>' : "") : '<div class="muted small">还没有体验码</div>';
    var partner = p.partner ? '<div class="kv"><span>活动码</span><span>' + esc(p.partner.code) + "</span></div>" + (p.partner.link ? '<div class="kv"><span>专属连结</span><span><a href="' + esc(p.partner.link) + '" target="_blank" rel="noopener">打开 ↗</a></span></div>' : "") +
      (p.partner.ledger ? '<div class="kv"><span>账本</span><span><a href="' + esc(p.partner.ledger) + '" target="_blank" rel="noopener">打开 ↗</a></span></div>' : "") : '<div class="muted small" style="padding-top:8px">还没有活动码</div>';
    var posts = p.posts.length ? p.posts.map(function (x) {
      return '<div style="padding:8px 0;border-top:1px solid var(--line2)"><div>' + (x.link ? '<a href="' + esc(x.link) + '" target="_blank" rel="noopener">' + esc(x.title) + " ↗</a>" : esc(x.title)) + '</div><div class="muted small">' + esc([x.platform, x.date].filter(Boolean).join(" · ")) + '</div>' +
        '<div class="small">' + x.metrics.map(function (m) { return "第 " + m.day + " 天 " + (m.views == null ? "—" : m.views.toLocaleString()); }).join(" · ") + "</div></div>";
    }).join("") : '<div class="muted small">还没有记下的发布。</div>';
    var info = p.info.map(function (x) {
      var link = /^https?:\/\//.test(x.v) ? x.v.split(/[\s,，]+|(?=https?:\/\/)/).filter(Boolean)[0] : "";
      return '<div class="kv"><span class="muted">' + esc(x.k) + "</span><span>" + (link ? '<a href="' + esc(link) + '" target="_blank" rel="noopener">打开 ↗</a>' : esc(x.v)) + "</span></div>";
    }).join("") +
      p.emails.map(function (e) { return '<div class="kv"><span class="muted">邮箱</span><span>' + esc(e.address) + (e.blocked ? ' <span class="badge b-bad">永不联系</span>' : "") + "</span></div>"; }).join("");
    $("app").innerHTML = '<div style="max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px">' +
      '<a href="#/people/wait" class="small">← KOL</a>' +
      '<div><h1 style="margin:0;font-size:24px">' + esc(p.name) + ' <span class="muted" style="font-weight:400;font-size:16px">' + esc(p.handle) + '</span></h1><div class="muted">' + esc(p.sub) + (p.doNotContact ? ' · <span class="badge b-bad">永不联系</span>' : "") + '</div></div>' +
      '<div class="two"><div style="flex:2 1 560px;min-width:0;display:flex;flex-direction:column;gap:16px">' +
        '<section class="card" style="padding:22px 24px;display:flex;flex-direction:column;gap:16px"><div><div class="lbl">现在的情况</div><div style="font-size:19px;font-weight:600">' + esc(p.situation) + '</div>' +
          (p.lastContact ? '<div class="muted small">最近一次联系：' + esc(p.lastContact) + "</div>" : "") + "</div>" + stepper +
          '<div style="border-top:1px solid var(--line2);padding-top:14px;display:flex;flex-direction:column;gap:10px"><div class="lbl" style="margin:0">接下来</div>' + pending +
            '<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><div style="flex:1 1 260px">' + (p.next ? esc(p.next) : '<span class="muted">没写下一步</span>') + (p.nextDate ? ' <span class="muted small">（下次跟进：' + esc(p.nextDate) + "）</span>" : "") + '</div><button class="btn sm" id="p-edit">改</button></div></div>' +
          '<div style="display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line2);padding-top:14px"><button class="btn primary" id="p-write"' + (p.doNotContact ? " disabled" : "") + '>写信给她</button>' +
          (p.stage !== "结案" ? '<button class="btn" id="p-close" style="border-color:transparent;color:var(--muted)">不再跟进</button>' : "") +
          (p.doNotContact ? "" : '<button class="btn" id="p-never" style="border-color:transparent;color:var(--bad)">不要再联系她</button>') + '</div></section>' +
        '<section class="card" style="padding:18px 24px;display:flex;flex-direction:column;gap:10px"><div style="display:flex;justify-content:space-between;flex-wrap:wrap"><b>来往记录</b><span class="muted small">左边是她，右边是我们' + (p.olderCount ? ' · 更早还有 ' + p.olderCount + ' 条，<a href="#" id="p-all">全部显示</a>' : "") + "</span></div>" +
          (bubbles || '<div class="muted">还没有来往</div>') + "</section></div>" +
        '<aside style="flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:16px">' +
          '<section class="card" style="padding:16px 18px;display:flex;flex-direction:column;gap:8px">' + trial + partner + "</section>" +
          '<section class="card" style="padding:16px 18px"><b>资料</b>' + info + "</section>" +
          '<section class="card" style="padding:16px 18px"><b>发布</b>' + posts + '<button class="btn sm" id="p-post" style="margin-top:10px">记下一条发布</button></section></aside></div></div>';
    wirePerson(p);
  }).catch(fail);
}

function wirePerson(p) {
  var reload = function () { renderPerson(p.id); };
  if ($("p-all")) $("p-all").onclick = function (e) { e.preventDefault(); renderPerson(p.id, true); };
  $("p-edit").onclick = function () {
    modal('<h2 style="margin:0;font-size:18px">接下来</h2>' +
      '<label class="field">下一步要做什么<input class="input" id="e-next" value="' + esc(p.next) + '"></label>' +
      '<label class="field">下次跟进<input class="input" type="date" id="e-date" value="' + esc(p.nextDateIso || "") + '"></label>' +
      '<label class="field">等谁<select class="input" id="e-turn"><option' + (p.turn === "我们" ? " selected" : "") + '>我们</option><option' + (p.turn === "KOL" ? " selected" : "") + '>KOL</option><option' + (p.turn === "无需动作" ? " selected" : "") + '>无需动作</option></select></label>' +
      '<div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" id="e-cancel">取消</button><button class="btn primary" id="e-save">保存</button></div>');
    $("e-cancel").onclick = closeModal;
    $("e-save").onclick = function () {
      post("/api/followup", { id: p.id, fields: { 下一步: $("e-next").value, 下次跟进日期: $("e-date").value, 当前轮到谁: $("e-turn").value } })
        .then(function () { closeModal(); toast("已保存"); reload(); }).catch(function (e) { toast("没保存：" + e.message); });
    };
  };
  if ($("p-write")) $("p-write").onclick = function () {
    modal('<h2 style="margin:0;font-size:18px">写信给 ' + esc(p.name) + '</h2><div class="muted small">点「发出」就算你同意了，会按额度排队发出；在「执行记录」里能看到结果。</div>' +
      '<label class="field">主旨（回复她上一封信时可以不填）<input class="input" id="w-subject"></label>' +
      '<label class="field">正文<textarea class="input" id="w-body" rows="10"></textarea></label>' +
      '<div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" id="w-cancel">取消</button><button class="btn primary" id="w-send">发出</button></div>');
    $("w-cancel").onclick = closeModal;
    $("w-send").onclick = function () {
      post("/api/write", { id: p.id, subject: $("w-subject").value, body: $("w-body").value })
        .then(function () { closeModal(); toast("已排队发出，结果看右上角"); watchJobs(); }).catch(function (e) { toast("没发出：" + e.message); });
    };
  };
  var close = function (never) {
    var q = never ? "以后这个项目不再联系 " + p.name + "，并结束跟进。确定吗？" : "结束对 " + p.name + " 的跟进？以后不会再自动催信。";
    if (!confirm(q)) return;
    post("/api/close", { id: p.id, never: never }).then(function () { toast(never ? "已标成永不联系" : "已结束跟进"); reload(); }).catch(function (e) { toast("没做成：" + e.message); });
  };
  if ($("p-close")) $("p-close").onclick = function () { close(false); };
  if ($("p-never")) $("p-never").onclick = function () { close(true); };
  $("p-post").onclick = function () {
    var link = prompt("把帖子链接贴在这里（https:// 开头）");
    if (!link) return;
    post("/api/post", { id: p.id, link: link }).then(function () { toast("已记下发布"); reload(); }).catch(function (e) { toast("没记下：" + e.message); });
  };
}

// --- 执行记录 ---
function renderLog() {
  $("app").innerHTML = '<div class="loading">读取执行记录…</div>';
  api("/api/log").then(function (l) {
    var runs = l.runs.map(function (r) {
      var cls = r.result === "完成" ? "b-ok" : r.result === "进行中" ? "b-warn" : r.result === "失败" ? "b-bad" : "";
      return '<div style="display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line2);flex-wrap:wrap"><span class="badge ' + cls + '">' + esc(r.result) + '</span><span style="flex:1 1 260px">' + esc(r.title) +
        (r.counts ? ' <span class="muted small">· ' + esc(r.counts) + "</span>" : "") + (r.notes ? '<div class="tone-bad small">' + esc(r.notes) + "</div>" : "") + '</span><span class="muted small">' + esc(r.start + (r.end ? "–" + r.end : "")) + " · " + esc(r.how === "定时任务" ? "每天例行" : "在 Claude 里跑的") + "</span></div>";
    }).join("");
    var ops = l.ops.map(function (o) {
      var cls = /完成|送达/.test(o.result) ? "b-ok" : /失败|退信/.test(o.result) ? "b-bad" : "";
      return '<tr><td class="muted" style="white-space:nowrap">' + esc(o.when) + "</td><td>" + esc(o.what) + (o.note ? '<div class="muted tiny">' + esc(o.note) + "</div>" : "") + '</td><td class="muted">' + esc([o.source, o.by].filter(Boolean).join(" · ")) + '</td><td><span class="badge ' + cls + '">' + esc(o.result) + "</span></td></tr>";
    }).join("");
    $("app").innerHTML = '<div style="display:flex;flex-direction:column;gap:14px"><div><h1 style="margin:0;font-size:22px">执行记录</h1><div class="muted">最近 3 天系统做过的事，最新的在最上面</div></div>' +
      '<section class="card" style="padding:14px 16px"><b>运行</b>' + (runs || '<div class="muted">最近 3 天没有运行记录</div>') + "</section>" +
      '<section class="card" style="overflow-x:auto"><table style="min-width:760px"><thead><tr><th>时间</th><th>做了什么</th><th>谁让做的</th><th>结果</th></tr></thead><tbody>' + (ops || '<tr><td colspan="4" class="muted">没有记录</td></tr>') + "</tbody></table></section></div>";
  }).catch(fail);
}

// --- 路由 ---
function route() {
  var h = location.hash.replace(/^#/, "") || "/";
  var parts = h.split("?")[0].split("/").filter(Boolean);
  var tab = parts[0] === "people" || parts[0] === "person" ? "people" : parts[0] === "log" ? "log" : "decide";
  Array.prototype.forEach.call(document.querySelectorAll("[data-tab]"), function (a) { a.classList.toggle("on", a.getAttribute("data-tab") === tab); });
  // The decision page uses the whole width: list, case and action side by side.
  $("app").classList.toggle("wide", tab === "decide");
  if (!state.overview) return;
  if (parts[0] === "people") renderPeople(parts[1] || "wait", "");
  else if (parts[0] === "person" && parts[1]) renderPerson(decodeURIComponent(parts[1]));
  else if (parts[0] === "log") renderLog();
  else renderDecide();
}
window.addEventListener("hashchange", function () { route(); window.scrollTo(0, 0); });
var SEEN_KEY = "kol-console-seen";
function loadNews() {
  var since = 0;
  try { since = Number(localStorage.getItem(SEEN_KEY)) || 0; } catch (e) {}
  if (!since) since = Date.now() - 24 * 3600 * 1000;
  return api("/api/news?since=" + since).then(function (n) {
    state.news = n;
    // Filled in place, so a draft being edited isn't redrawn.
    var box = $("news");
    if (box) box.innerHTML = newsBlock();
  }).catch(function () {});
}
function markSeen() { try { localStorage.setItem(SEEN_KEY, String(Date.now())); } catch (e) {} }
window.addEventListener("pagehide", markSeen);
loadOverview().then(function () { route(); loadNews(); }).catch(fail);
setInterval(function () { loadOverview().then(function () { if (!location.hash || location.hash === "#/") renderDecide(); }).catch(function () {}); }, 5 * 60 * 1000);
</script>
