<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KOL 决策台</title>
<style>
:root{--bg:#F5F6F8;--card:#FFFFFF;--line:#E3E6EB;--line2:#EEF0F3;--ink:#1A1D23;--ink2:#3B414C;--muted:#5B6270;--blue:#2457D6;--blue2:#1A3FA0;--blue-bg:#E6ECFB;--warn:#8A3D00;--warn-bg:#FDEBD8;--warn-line:#F2C9A0;--bad:#B42318;--bad-bg:#FDE8E7;--bad-line:#E9B4AE;--ok:#1F6B46;--ok-bg:#E6F4EC;--purple:#5B2BA8;--purple-bg:#EFE7FB}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;font-size:14px;line-height:1.55}
a{color:var(--blue);text-decoration:none}a:hover{color:var(--blue2);text-decoration:underline}
button{font:inherit}
.top{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:10px 24px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.brand{font-weight:700;font-size:16px}
.tab{padding:7px 12px;border-radius:6px;color:var(--ink2);display:inline-flex;gap:6px;align-items:center}
.tab:hover{background:#ECEEF2;text-decoration:none;color:var(--ink)}
.tab.on{background:var(--blue-bg);color:var(--blue2);font-weight:600}
.cnt{font-size:12px;font-weight:600;background:var(--blue);color:#fff;border-radius:10px;padding:0 7px;line-height:20px}
.right{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
.btn{display:inline-flex;gap:8px;align-items:center;justify-content:center;min-height:38px;padding:0 14px;border-radius:7px;border:1px solid #CDD2DA;background:#fff;color:var(--ink);font-weight:500;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--bg);text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.primary:hover{background:var(--blue2)}
.btn.big{min-height:46px;padding:0 18px;font-size:15px}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px}
.btn.text{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad)}
.btn.solid-bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.kbd{font-size:11px;line-height:18px;padding:0 5px;border-radius:4px;border:1px solid currentColor;opacity:.65;font-family:ui-monospace,Menlo,monospace}
.pill{display:inline-flex;gap:6px;align-items:center;min-height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line);background:var(--bg);color:var(--ink2);font-weight:600;font-size:13px;cursor:pointer}
.pill .dot{width:8px;height:8px;border-radius:50%;background:#1F8A55}
.pill.bad{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad)}.pill.bad .dot{background:var(--bad)}
.pill.warn{background:#FFF8F1;border-color:var(--warn-line);color:var(--warn)}.pill.warn .dot{background:#C2620C}
.panel{position:absolute;right:0;top:40px;width:400px;max-width:calc(100vw - 32px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(20,20,30,.14);z-index:30}
.panel .row{display:flex;gap:10px;padding:10px 14px;border-top:1px solid var(--line2);align-items:flex-start}
#banners{display:flex;flex-direction:column}
.banner{background:#FFF8F1;border-bottom:1px solid var(--warn-line);color:var(--warn);padding:8px 24px;font-size:13px}
.banner.red{background:#FDF2F1;border-color:var(--bad-line);color:var(--bad)}
main{padding:20px 24px 48px;max-width:1680px;margin:0 auto}
.narrow{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
.badge{display:inline-block;font-size:12px;line-height:20px;padding:0 8px;border-radius:4px;white-space:nowrap;background:#ECEEF2;color:var(--ink2)}
.b-blue{background:var(--blue-bg);color:var(--blue2)}.b-warn{background:var(--warn-bg);color:var(--warn)}.b-bad{background:var(--bad-bg);color:var(--bad)}.b-ok{background:var(--ok-bg);color:var(--ok)}.b-purple{background:var(--purple-bg);color:var(--purple)}
.chip{border:1px solid #CDD2DA;background:#fff;border-radius:16px;padding:5px 12px;font-size:13px;color:var(--ink2);cursor:pointer}
.chip.on{border-color:var(--blue);color:var(--blue2);background:#EEF2FD;font-weight:600}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar>div{height:6px;border-radius:3px;background:var(--blue)}
.lbl{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em;margin-bottom:4px}
.quote{background:var(--bg);border-radius:8px;padding:12px 16px;white-space:pre-wrap;font-size:15px}
.suggest{background:#EEF3FD;border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.input{font:inherit;font-size:14px;color:var(--ink);border:1px solid #CDD2DA;border-radius:7px;padding:8px 10px;background:#fff;width:100%;min-height:38px}
.input.bad{border-color:var(--bad)}
textarea.input{resize:vertical;line-height:1.7}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink)}
.field>span:first-child{font-size:12px;color:var(--muted);font-weight:600}
.hint{font-size:12px;color:var(--muted)}.hint.bad{color:var(--bad)}.hint.ok{color:var(--ok)}
details summary{cursor:pointer;color:var(--muted);font-size:13px}
.views{display:flex;gap:4px;flex-wrap:wrap;background:#ECEEF2;padding:4px;border-radius:8px;align-self:flex-start;max-width:100%}
.view{padding:7px 12px;border-radius:6px;color:var(--ink2);white-space:nowrap}
.view:hover{background:var(--line);text-decoration:none;color:var(--ink)}
.view.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--line)}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:#FAFBFC}
td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:top}
.tone-warn{color:var(--warn);font-weight:600}.tone-bad{color:var(--bad);font-weight:600}.tone-ok{color:var(--ok)}.tone-muted{color:var(--muted)}
.two{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.them{align-self:flex-start;max-width:78%;background:#F1F2F4;border-radius:4px 14px 14px 14px;padding:10px 14px;white-space:pre-wrap}
.us{align-self:flex-end;max-width:78%;background:var(--blue-bg);border-radius:14px 4px 14px 14px;padding:10px 14px;white-space:pre-wrap}
.event{align-self:center;font-size:12px;color:var(--muted);background:#FAFBFC;border:1px solid var(--line2);border-radius:12px;padding:2px 10px;text-align:center}
.who{font-size:12px;color:var(--muted);margin-bottom:2px;white-space:normal}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line2)}
.kv span:last-child{text-align:right;word-break:break-all}
.stepper{list-style:none;margin:0;padding:0;display:flex;gap:4px;flex-wrap:wrap}
.stepper li{flex:1 1 80px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.stepper .seg{height:6px;border-radius:3px;background:var(--line)}
.stepper.grey .seg{filter:grayscale(1);opacity:.5}
.err{background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:12px 14px}
.loading{padding:40px;text-align:center;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(20,22,28,.3);display:flex;align-items:flex-start;justify-content:center;padding:60px 16px;z-index:40;overflow:auto}
.modal>div{background:#fff;border-radius:12px;padding:20px 22px;width:100%;max-width:620px;display:flex;flex-direction:column;gap:12px}
.scrim{position:fixed;inset:0;background:rgba(20,22,28,.3);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:480px;max-width:100%;background:#fff;box-shadow:-10px 0 30px rgba(20,20,30,.18);display:flex;flex-direction:column;z-index:41}
.drawer-head{padding:18px 22px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:10px}
.drawer-head h2{margin:0;font-size:18px}
.drawer-body{flex:1;overflow:auto;padding:18px 22px;display:flex;flex-direction:column;gap:14px}
.drawer-foot{padding:14px 22px;border-top:1px solid var(--line2);display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.confirm{border:1px solid var(--bad-line);background:#FDF2F1;border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.confirm b{color:var(--bad);font-size:13px}
.confirm.blue{border-color:#C9D6F5;background:#F2F5FD}.confirm.blue b{color:var(--blue2)}
main.wide{max-width:none}
.dgrid{display:grid;grid-template-columns:minmax(280px,20%) minmax(0,1fr) minmax(380px,28%);gap:16px;align-items:start}
.dlist{position:sticky;top:64px;max-height:calc(100vh - 84px);overflow:auto;padding:6px 0}
.dgroup{font-size:12px;font-weight:600;color:var(--muted);padding:10px 14px 4px;display:flex;justify-content:space-between}
.ditem{display:flex;flex-direction:column;align-items:flex-start;gap:4px;width:100%;text-align:left;padding:9px 14px;border:0;border-left:3px solid transparent;background:transparent;font:inherit;font-size:13px;color:var(--ink);cursor:pointer}
.ditem:hover{background:var(--bg)}
.ditem.on{background:#EEF2FD;border-left-color:var(--blue)}
.dmeta{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.dtitle{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.45}
.dinfo{padding:20px 24px;display:flex;flex-direction:column;gap:16px;min-width:0}
.dact{position:sticky;top:64px;max-height:calc(100vh - 84px);overflow:auto;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.segs{display:flex;gap:0;border:1px solid #CDD2DA;border-radius:8px;overflow:hidden}
.segs button{flex:1;border:0;background:#fff;font:inherit;font-size:13px;padding:9px 8px;cursor:pointer;color:var(--ink2);display:flex;gap:6px;align-items:center;justify-content:center}
.segs button+button{border-left:1px solid #CDD2DA}
.segs button.on{background:#EEF2FD;color:var(--blue2);font-weight:600}
.choice{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.choice.on{border-color:var(--blue);background:#F7F9FE}
.choice input{margin-top:4px}
.drow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.steps{margin:0;padding-left:20px;font-size:13px;display:flex;flex-direction:column;gap:4px}
.params{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.timeline{display:flex;flex-direction:column;gap:6px;font-size:13px}
.timeline div{display:flex;gap:12px}.timeline div span:first-child{flex:0 0 90px;color:var(--muted)}
.dpick{display:none}
@media (max-width:1279px){.dgrid{grid-template-columns:minmax(0,1fr)}.dlist{display:none}.dpick{display:flex}.dact{position:static;max-height:none}}
@media (max-width:760px){.params{grid-template-columns:1fr}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:10px;padding:10px 14px;box-shadow:0 6px 20px rgba(0,0,0,.18);font-size:14px;max-width:calc(100% - 32px);display:flex;gap:12px;align-items:center;z-index:50}
.toast.bad{background:var(--bad)}
.toast .tbar{width:70px;height:4px;border-radius:2px;background:#3B414C;display:inline-block;overflow:hidden}
.toast .tbar span{display:block;height:4px;background:#8FB0FF;width:100%;transition:width linear}
.toast .btn{min-height:30px;font-size:13px;background:transparent;color:#fff;border-color:#5B6270}
@media (max-width:640px){.top,main{padding-left:16px;padding-right:16px}.banner{padding-left:16px;padding-right:16px}}
</style>
</head>
<body>
<header class="top">
  <span class="brand">KOL 决策台</span>
  <span class="muted small" id="project"></span>
  <nav aria-label="主导航" style="display:flex;gap:4px;flex-wrap:wrap">
    <a class="tab" data-tab="decide" href="#/">待你决定 <span class="cnt" id="n-decide" hidden></span></a>
    <a class="tab" data-tab="people" href="#/people/wait">KOL</a>
    <a class="tab" data-tab="log" href="#/log">执行记录</a>
    <a class="tab" data-tab="settings" href="#/settings">设置</a>
  </nav>
  <div class="right">
    <div style="position:relative">
      <button class="pill" id="status" aria-expanded="false"><span class="dot"></span><span id="status-text">…</span></button>
      <div class="panel" id="status-panel" hidden></div>
    </div>
    <span class="small" id="synced"></span>
    <button class="btn sm" id="refresh">刷新</button>
    <div style="position:relative">
      <button class="btn sm" id="pause" style="border-color:var(--bad-line);color:var(--bad)">暂停所有发送</button>
      <div class="panel" id="pause-panel" style="width:320px;padding:12px 14px" hidden></div>
    </div>
  </div>
</header>
<div id="banners"></div>
<main id="app"><div class="loading">正在读数据…第一次打开要一两分钟，读完会自动显示。</div></main>
<div id="notes" style="position:fixed;left:50%;bottom:76px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:50;max-width:calc(100% - 32px)"></div>
<div class="toast" id="toast" hidden role="status"><span id="toast-text"></span><span class="tbar" id="toast-bar" hidden><span></span></span><button class="btn" id="toast-btn" hidden></button></div>
<div class="modal" id="modal" hidden><div id="modal-body"></div></div>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" role="dialog" hidden></aside>
<script>
"use strict";
var state = { overview: null, idx: 0, handled: {}, changing: false, jobsSeen: {}, convo: {}, posted: {}, drafts: {}, pick: {}, focus: "", logFilter: "all" };
var UNDO_MS = 5000;

function esc(v) {
  return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; });
}
function $(id) { return document.getElementById(id); }
function all(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
function api(path, opts) {
  return fetch(path, opts).then(function (r) {
    return r.json().then(function (body) { if (!r.ok) throw new Error(body.error || ("出错了（" + r.status + "）")); return body; });
  });
}
function post(path, body) {
  return api(path, { method: "POST", headers: { "content-type": "application/json", "x-kol-console": "1" }, body: JSON.stringify(body || {}) }).then(function (r) {
    // These answer once the change has been read back: the queue, counts and banners follow it at once.
    if (/^\/api\/(settings\/|followup|close|resume|post|profile|default-email|add-email|find)/.test(path)) setTimeout(refreshOverview, 0);
    return r;
  });
}
function refreshOverview() {
  return loadOverview().then(function () { renderBanners(); if (!location.hash || location.hash === "#/" || location.hash.indexOf("#/?") === 0) { if ($("drawer").hidden) renderDecide(); } }).catch(function () {});
}
/** Only web links become links; anything else (javascript:, data:) is shown as text. */
function safeUrl(u) { return /^https?:\/\//i.test(String(u || "").trim()) ? String(u).trim() : ""; }
function isEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(v || "").trim()); }
function isoAdd(days) { var d = new Date(Date.now() + days * 86400000); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
/** 「11 月 10 日（周二）」 and how far from today, for date pickers (2.7). */
function dayText(iso) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(iso || "")) return "";
  var p = iso.split("-").map(Number), d = new Date(p[0], p[1] - 1, p[2]);
  var n = Math.round((d - new Date(new Date().toDateString())) / 86400000);
  var rel = n === 0 ? "今天" : n === 1 ? "明天" : n > 1 ? (n % 7 === 0 && n <= 28 ? (n === 7 ? "一周后" : n / 7 + " 周后") : n + " 天后") : (-n) + " 天前";
  return p[1] + " 月 " + p[2] + " 日（周" + "日一二三四五六".charAt(d.getDay()) + "）· " + rel;
}

/** Example values for previewing a template: placeholders it can fill show as blue chips, unknown ones as red. */
var SAMPLE = { 稱呼: "小鹿", 称呼: "小鹿", 账号名称: "deer_lu", 體驗碼: "deer_lu", 体验码: "deer_lu", 已用: "1", 剩餘: "2", 剩余: "2", 次數: "3", 次数: "3", 到期日: "11 月 10 日", "已於 / 將於": "將於", "M 月 D 日": "11 月 10 日",
  約定日期: "11 月 15 日", 约定日期: "11 月 15 日", 活動碼: "deer_tafu", 活动码: "deer_tafu", 專屬連結: "https://tafu.me/p/deer", 专属连结: "https://tafu.me/p/deer", 帳本連結: "https://tafu.me/l/deer", 账本连结: "https://tafu.me/l/deer", 粉絲折扣: "85 折", 粉丝折扣: "85 折" };
function fillSample(s) {
  return esc(s || "").replace(/\{([^{}\n]+)\}/g, function (whole, k) {
    var v = SAMPLE[k.trim()];
    return v ? '<span style="background:var(--blue-bg);color:var(--blue2);padding:0 3px;border-radius:3px">' + esc(v) + "</span>" : '<span style="background:var(--bad-bg);color:var(--bad);padding:0 3px;border-radius:3px">' + whole + "</span>";
  });
}

// --- 提示条和撤销（2.3）---
var toastState = { timer: null, undo: null };
function toast(text, o) {
  o = o || {};
  // While an action can still be undone, other messages stack above it instead of taking its undo away.
  if (!o.undo && toastState.undo) return note(text, o.bad);
  var t = $("toast");
  clearTimeout(toastState.timer);
  t.className = "toast" + (o.bad ? " bad" : "");
  $("toast-text").textContent = text;
  var b = $("toast-btn"), bar = $("toast-bar");
  toastState.undo = o.undo || null;
  bar.hidden = !o.undo;
  b.hidden = !(o.undo || o.bad);
  b.innerHTML = o.undo ? '撤销 <span class="kbd">Z</span>' : "知道了";
  b.onclick = function () { var u = toastState.undo; hideToast(); if (u) u(); };
  if (o.undo) {
    var fill = bar.firstChild;
    fill.style.transition = "none"; fill.style.width = "100%";
    requestAnimationFrame(function () { requestAnimationFrame(function () { fill.style.transition = "width " + UNDO_MS + "ms linear"; fill.style.width = "0%"; }); });
  }
  t.hidden = false;
  // A red one stays until it is dismissed.
  if (!o.bad) toastState.timer = setTimeout(hideToast, o.undo ? UNDO_MS + 200 : 4000);
}
function hideToast() { $("toast").hidden = true; toastState.undo = null; toastState.owner = null; }
function note(text, bad) {
  var n = document.createElement("div");
  n.className = "toast" + (bad ? " bad" : "");
  n.style.cssText = "position:static;transform:none";
  n.textContent = text;
  if (bad) { var b = document.createElement("button"); b.className = "btn"; b.textContent = "知道了"; b.onclick = function () { n.remove(); }; n.appendChild(b); }
  $("notes").appendChild(n);
  if (!bad) setTimeout(function () { n.remove(); }, 4000);
}
function failToast(prefix, e) { toast(prefix + e.message, { bad: true }); }

/** Hides a card at once and does the action after five seconds unless 撤销 is pressed (E-22). */
function onDecide() { var h = location.hash || "#/"; return h === "#/" || h === "#" || h.indexOf("#/?") === 0; }
function redrawDecide() { if (onDecide() && $("drawer").hidden) renderDecide(); else renderCount(); }
function later(id, text, action, after) {
  // Until it is carried out the card stays in the queue greyed, 「5 秒后执行」 (4.1.1).
  state.handled[id] = "pending";
  var undone = false, token = {};
  toast(text, { undo: function () { undone = true; delete state.handled[id]; toast("已撤销"); redrawDecide(); } });
  toastState.owner = token;
  renderDecide();
  setTimeout(function () {
    if (undone) return;
    // Its undo ends the moment it is carried out, whatever the bar shows.
    if (toastState.owner === token) hideToast();
    state.handled[id] = true;
    redrawDecide();
    action().then(function (r) {
      delete state.drafts[id];
      if (r && r.job) watchJobs();
      if (r && r.paused && !r.job) toast("现在暂停着：已经记下你同意了，恢复发送后会发出");
      if (after) after(r);
    }).catch(function (e) { delete state.handled[id]; failToast("没做成：", e); redrawDecide(); });
  }, UNDO_MS);
}
/** The same five seconds for an action that hides no card (写信 from her page). */
function delayed(text, action, after) {
  var undone = false, token = {};
  toast(text, { undo: function () { undone = true; toast("已撤销"); } });

        if (li) { li.hidden = !a; li.textContent = (a === "永不联系" ? "标成永不联系，" : "") + "结束跟进（原因：" + ($("after-reason").value || "还没选") + "）"; }
      };
      $("after-action").addEventListener("change", sync);
      $("after-reason").addEventListener("change", sync);
      sync();
    };
  } else if (c.kind === "problem") {
    var withdraw = { label: "不做了，撤掉", key: "D", run: function () { later(c.id, "已撤掉：" + c.headline, function () { return post("/api/problem-done", { id: c.id }); }); } };
    if (c.unknownSend) {
      ask = "到发信邮箱的「已发送」里找过了吗？告诉系统结果";
      acts = [
        { label: "确认已经发出", key: "A", run: function () {
          inlineConfirm($("confirm-box"), {
            title: "在发信邮箱的「已发送」里找到这封信了吗？", ok: "找到了，记成已发出", blue: true,
            body: '<div class="small">确认后记成已发出，不会再发。</div>' + (c.codeAction ? '<label class="field"><span>码名（这一条还要' + esc(c.codeAction) + '；后台建好了才填，没建好留空）</span><input class="input" id="sent-code" placeholder="例如 deer_lu"></label>' : ""),
            check: function (box) { var el = box.querySelector("#sent-code"); return { code: el ? el.value.trim() : "" }; },
            run: function (v) { later(c.id, "已记成发出：" + c.headline, function () { return post("/api/problem-sent", { id: c.id, code: v.code }); }); },
          });
        } },
        { label: "确认没发出，重新审核", key: "R", run: function () { later(c.id, "已退回重新审核：" + c.headline, function () { return post("/api/problem-retry", { id: c.id }); }); } },
        withdraw,
      ];
    } else {
      ask = c.unknownCode ? "核对后告诉系统结果" : "重做还是撤掉？";
      acts = [
        { label: c.unknownCode ? "确认没做成，重新审核" : "重新审核", key: "A", run: function () { later(c.id, "已退回重新审核：" + c.headline, function () { return post("/api/problem-retry", { id: c.id }); }); } },
        withdraw,
      ];
    }
  } else if (c.kind === "overdue") {
    var posted = !!state.posted[c.id];
    ask = "她发了吗？";
    body += '<div class="segs" role="radiogroup" aria-label="她发了吗">' +
      '<button role="radio" aria-checked="' + !posted + '" class="' + (posted ? "" : "on") + '" data-path="notyet">还没发' + ((c.asked || 0) >= 2 ? "" : "：写信问她") + ' <span class="kbd">1</span></button>' +
      '<button role="radio" aria-checked="' + posted + '" class="' + (posted ? "on" : "") + '" data-path="posted">已经发了：记下链接 <span class="kbd">2</span></button></div>';
    if (posted) {
      body += '<label class="field"><span>帖子链接</span><input class="input" id="post-link" placeholder="https://"><span class="hint" id="post-hint">记下后她会移到「已发布」，之后自动记播放和互动</span></label>';
      acts = [{ label: "记下这条发布", key: "A", run: function () {
        var link = $("post-link").value.trim();
        if (!/^https:\/\/\S+$/.test(link)) { $("post-link").classList.add("bad"); $("post-hint").className = "hint bad"; $("post-hint").textContent = "要贴完整的帖子链接，https:// 开头"; $("post-link").focus(); return; }
        later(c.id, "已记下发布：" + who(c), function () { return post("/api/post", { id: c.who.id, link: link }); });
      } }];
    } else if ((c.asked || 0) >= 2) {
      var pick = state.pick[c.id] || { what: "wait", date: isoAdd(14) };
      state.pick[c.id] = pick;
      var line = function (key, title, sub) { return '<label class="choice' + (pick.what === key ? " on" : "") + '"><input type="radio" name="next" aria-label="' + title + '" value="' + key + '"' + (pick.what === key ? " checked" : "") + '><span><b>' + title + '</b><br><span class="hint">' + sub + "</span></span></label>"; };
      body += '<div class="lbl" style="margin:0">接下来</div>' + line("wait", "再等", "改一个新的约定日期，到时候还没发会再出这张卡") +
        (pick.what === "wait" ? '<label class="field" style="padding-left:28px"><span>新的约定发布日期</span><input class="input" type="date" id="wait-date" value="' + esc(pick.date) + '" min="' + isoAdd(1) + '"><span class="hint" id="wait-hint">' + esc(dayText(pick.date)) + "</span></label>" : "") +
        line("pause", "暂缓", "先放着，不再自动出卡片，阶段记下，恢复跟进时回到已约发布") + line("close", "结案", "她还没执行的事都会撤掉");
      var main = pick.what === "wait" ? "改到 " + (dayText(pick.date).split("（")[0] || "新日期") : pick.what === "pause" ? "暂缓" : "结案";
      acts = [{ label: main, key: "A", run: function () {
        if (pick.what === "wait") {
          var d = $("wait-date").value;
          if (!d) { toast("先选一个日期", { bad: true }); return; }
          later(c.id, her(c) + " 的约定发布日期改到 " + dayText(d).split("（")[0], function () { return post("/api/followup", { id: c.who.id, fields: { 约定发布日期: d } }); });
        } else if (pick.what === "pause") {
          later(c.id, "已暂缓：" + who(c), function () { return post("/api/followup", { id: c.who.id, fields: { 阶段: "暂缓" } }); });
        } else {
          inlineConfirm($("confirm-box"), { title: "确定结束对 " + her(c) + " 的跟进？", ok: "确定结案", body: reasonSelect("close-reason", "无回应") + '<div class="small">她还没执行的事都会撤掉。</div>',
            check: function (box) { return box.querySelector("#close-reason").value; },
            run: function (reason) { later(c.id, "已结案：" + who(c), function () { return post("/api/close", { id: c.who.id, never: false, reason: reason }); }); } });
        }
      } }];
      wire = function () {
        all("input[name=next]").forEach(function (r) { r.addEventListener("change", function () { pick.what = r.value; renderDecide(); }); });
        if ($("wait-date")) $("wait-date").addEventListener("change", function () { pick.date = $("wait-date").value; renderDecide(); });
      };
    } else {
      body += mailFields(c);
      acts = [{ label: "发信问她", key: "A", run: function () {
        var m = readMail(); if (!m) return;
        later(c.id, "已排队发信给 " + her(c), function () {
          // The next follow-up date moves only once the mail has actually gone out (C-07, S-E4).
          return post("/api/write", { id: c.who.id, subject: m.subject, body: m.body, purpose: "发布确认" });
        });
      } }];
    }
    wire = wire || function () {};
    var w0 = wire;
    wire = function () {
      w0();
      all("[data-path]").forEach(function (b) { b.addEventListener("click", function () { state.posted[c.id] = b.getAttribute("data-path") === "posted"; renderDecide(); if ($("post-link")) $("post-link").focus(); }); });
    };
  } else if (c.kind === "waiting") {
    ask = "写信问她，还是定个下次跟进的日子？";
    body += mailFields(c);
    confirmBox = '<div id="next-box" hidden></div>' + confirmBox;
    acts = [
      { label: "发信问她", key: "A", run: function () {
        var m = readMail(); if (!m) return;
        later(c.id, "已排队发信给 " + her(c), function () { return post("/api/write", { id: c.who.id, subject: m.subject, body: m.body }); });
      } },
      { label: "定下次跟进", key: "F", run: function () {
        var box = $("next-box"), d0 = isoAdd(7);
        inlineConfirm(box, { title: "下次什么时候跟进？", ok: "定下", blue: true,
          body: '<label class="field"><span>下次跟进</span><input class="input" type="date" id="next-date" value="' + d0 + '" min="' + isoAdd(1) + '"><span class="hint" id="next-hint">' + esc(dayText(d0)) + "</span></label>",
          check: function (b) { var v = b.querySelector("#next-date").value; if (!v) { toast("先选一个日期", { bad: true }); return false; } return v; },
          run: function (d) { later(c.id, her(c) + " 下次跟进改到 " + dayText(d).split("（")[0], function () { return post("/api/followup", { id: c.who.id, fields: { 下次跟进日期: d } }); }); } });
        $("next-date").addEventListener("input", function () { $("next-hint").textContent = dayText($("next-date").value); });
      } },
      { label: "暂缓", key: "P", run: function () { later(c.id, "已暂缓：" + who(c), function () { return post("/api/followup", { id: c.who.id, fields: { 阶段: "暂缓" } }); }); } },
      { label: "结案", key: "C", danger: true, run: function () {
        inlineConfirm($("confirm-box"), { title: "确定结束对 " + her(c) + " 的跟进？", ok: "确定结案", body: reasonSelect("close-reason", "回复后失联") + '<div class="small">她还没执行的事都会撤掉。</div>',
          check: function (box) { return box.querySelector("#close-reason").value; },
          run: function (reason) { later(c.id, "已结案：" + who(c), function () { return post("/api/close", { id: c.who.id, never: false, reason: reason }); }); } });
      } },
    ];
  } else if (c.kind === "mail") {
    ask = c.blocked ? "看一眼就行" : "要不要回？";
    if (!c.blocked) body += '<div class="hint">要回信的话：在 Claude 里说「处理来信」，写好的草稿会排进这里。</div>';
    acts = [{ label: "不用回", key: "D", run: function () { later(c.id, "已标成不用回：" + who(c), function () { return post("/api/mail-done", { id: c.id.slice(5) }); }); } }];
    if (!c.blocked) acts.push({ label: "标成永不联系", key: "N", danger: true, run: function () {
      inlineConfirm($("confirm-box"), { title: "这个项目以后不会再给 " + her(c) + " 发任何信", ok: "确定永不联系",
        body: '<label class="field"><span>原因（必填）</span><input class="input" id="never-why" placeholder="例如：明确说不要再联系"></label>',
        check: function (box) { var v = box.querySelector("#never-why").value.trim(); if (!v) { box.querySelector("#never-why").classList.add("bad"); return false; } return v; },
        run: function (why) { later(c.id, "已标成永不联系：" + who(c), function () { return post("/api/mail-never", { id: c.id.slice(5), note: why }); }); } });
    } });
  } else if (c.kind === "unknown") {
    ask = "这是哪位 KOL 的？";
    acts = [
      { label: "关联到 KOL", key: "A", run: function () { linkMail(c); } },
      { label: "跟 KOL 无关", key: "D", run: function () { later(c.id, "已归档：" + c.headline, function () { return post("/api/mail-done", { id: c.id.slice(8) }); }); } },
    ];
  } else if (c.kind === "expired") {
    var tp = state.pick[c.id] || { what: "extend", days: 7 };
    state.pick[c.id] = tp;
    ask = "延期、换一个新码，还是不再跟进？";
    var opt = function (key, title, sub) { return '<label class="choice' + (tp.what === key ? " on" : "") + '"><input type="radio" name="trial" aria-label="' + title + '" value="' + key + '"' + (tp.what === key ? " checked" : "") + '><span><b>' + title + '</b><br><span class="hint">' + sub + "</span></span></label>"; };
    var left = c.trial && c.trial.max ? Math.max(0, c.trial.max - c.trial.used) : 0;
    body += '<div class="lbl" style="margin:0">选一个</div>' + opt("extend", "延期", left ? "还剩 " + left + " 次，延长有效期" : "延长有效期") +
      (tp.what === "extend" ? '<label class="field" style="padding-left:28px"><span>延几天</span><input class="input" type="number" id="ext-days" min="1" max="60" value="' + tp.days + '"><span class="hint" id="ext-hint">1–60 天 · 从今天算，延到 ' + esc(dayText(isoAdd(tp.days)).split("（")[0]) + " 左右</span></label>" : "") +
      opt("new", "换新码", "重新发一个码（次数和天数按设置的默认值）") + opt("stop", "不再跟进这个码", "这个码不再提醒，她的跟进不变");
    if (tp.what !== "stop") {
      stepsLabel = "点「交给 Claude 写信」后会";
      steps = [{ text: "Claude 写一封回信，带上「" + (tp.what === "extend" ? "延期 " + tp.days + " 天" : "换新码") + "」（在 Claude 里说「改退回的草稿」）" }, { text: "写好排回这里，你看过再同意，同意后才" + (tp.what === "extend" ? "延期" : "建新码") + "并发信" }];
    }
    acts = [tp.what === "stop"
      ? { label: "不再跟进这个码", key: "A", run: function () { later(c.id, "这个码不再跟进：" + who(c), function () { return post("/api/drop", { id: c.id, note: "不再跟进这个码" }); }); } }
      : { label: "交给 Claude 写信", key: "A", run: function () {
        var days = Number(($("ext-days") || {}).value || tp.days);
        if (tp.what === "extend" && !(days >= 1 && days <= 60)) { toast("延期天数要在 1 到 60 之间", { bad: true }); return; }
        var note = tp.what === "extend" ? "延期 " + days + " 天" : "换新码（次数和天数按默认值）";
        later(c.id, "已交给 Claude 写信：" + note, function () { return post("/api/revise", { id: c.id, note: note }); });
      } }];
    if (tp.what !== "stop") acts.push(drop);
    wire = function () {
      all("input[name=trial]").forEach(function (r) { r.addEventListener("change", function () { tp.what = r.value; renderDecide(); }); });
      if ($("ext-days")) $("ext-days").addEventListener("input", function () {
        var n = Number($("ext-days").value);
        tp.days = n;
        $("ext-hint").textContent = n >= 1 && n <= 60 ? "1–60 天 · 从今天算，延到 " + dayText(isoAdd(n)).split("（")[0] + " 左右" : "要在 1 到 60 之间";
        $("ext-hint").className = n >= 1 && n <= 60 ? "hint" : "hint bad";
      });
    };
  } else if (c.kind === "bounce") {
    ask = "换一个邮箱继续联系，还是结束跟进？";
    stepsLabel = "点「加新邮箱并写信」后会";
    steps = c.steps;
    body += '<label class="field"><span>新邮箱</span><input class="input" id="new-email" data-keep="new-email" placeholder="例如 biz.anan@example.com"><span class="hint" id="email-hint">加到她的档案，之后可以往这个地址写信</span></label>';
    acts = [
      { label: "加新邮箱并写信", key: "A", run: function () {
        var email = $("new-email").value.trim().toLowerCase();
        if (!isEmail(email) || email === (c.bounced || "").toLowerCase()) { $("new-email").focus(); checkEmail(); return; }
        post("/api/add-email", { id: c.who.id, email: email }).then(function () {
          delete state.convo[c.who.id];
          openWrite(c.who.id, { to: email, card: c });
        }).catch(function (e) { failToast("没加上：", e); });
      } },
      { label: "不用管", key: "D", run: function () { later(c.id, "已放下：" + c.headline, function () { return post("/api/mail-done", { id: c.id.slice(7) }); }); } },
      { label: "结案", key: "C", danger: true, run: function () {
        inlineConfirm($("confirm-box"), { title: "确定结束对 " + her(c) + " 的跟进？", ok: "确定结案", body: '<div class="small">原因：退信或邮箱无效 · 她还没执行的事都会撤掉</div>',
          run: function () { later(c.id, "已结案：" + who(c), function () { return post("/api/close", { id: c.who.id, never: false, reason: "退信或邮箱无效" }).then(function () { return post("/api/mail-done", { id: c.id.slice(7) }); }); }); } });
      } },
    ];
    var checkEmail = function () {
      var v = $("new-email").value.trim(), h = $("email-hint");
      if (!v) { h.className = "hint"; h.textContent = "加到她的档案，之后可以往这个地址写信"; $("new-email").classList.remove("bad"); return; }
      var bad = !isEmail(v) ? "邮箱格式不对" : v.toLowerCase() === (c.bounced || "").toLowerCase() ? "这就是退信的地址，换一个" : "";
      h.className = bad ? "hint bad" : "hint ok"; h.textContent = bad || "格式正确";
      $("new-email").classList.toggle("bad", !!bad);
    };
    wire = function () { $("new-email").addEventListener("input", checkEmail); checkEmail(); };
  }
  return { ask: ask, body: body, after: confirmBox, acts: acts, steps: steps, stepsLabel: stepsLabel, wire: wire };
}

function mailFields(c) {
  var d = c.draft || { subject: "", body: "" };
  return '<label class="field"><span>主旨</span><input class="input" id="draft-subject" value="' + esc(d.subject) + '" placeholder="她回过我们的信就可以不填"></label>' +
    '<label class="field"><span>' + esc(d.label || "写给她的信") + '</span><textarea class="input" id="draft-body" rows="9" placeholder="写给她的信">' + esc(d.body) + "</textarea></label>" +
    (d.note ? '<div class="hint">' + esc(d.note) + "</div>" : "");
}
function readMail() {
  var subject = $("draft-subject").value || "", body = $("draft-body").value || "";
  if (!body.trim()) { toast("先把信写好", { bad: true }); $("draft-body").focus(); return null; }
  if (/\{[^}]*\}/.test(body)) { toast("信里还有 { } 占位符，换成实际的字再发", { bad: true }); return null; }
  return { subject: subject, body: body };
}

function linkMail(c) {
  modal('<h2 style="margin:0;font-size:18px">这是哪位 KOL 的？</h2><div class="muted small">' + esc(c.headline) + '</div>' +
    '<input class="input" id="l-q" placeholder="搜名字、账号、邮箱"><div id="l-list" class="small"></div>' +
    '<div class="hint">选中后，发件地址会加到她的档案，以后的来信会自动对上。</div><div style="display:flex;justify-content:flex-end"><button class="btn" id="l-cancel">取消</button></div>');
  $("l-cancel").onclick = closeModal;
  var t = null;
  $("l-q").oninput = function () {
    clearTimeout(t);
    var q = $("l-q").value.trim();
    t = setTimeout(function () {
      if (!q) { $("l-list").innerHTML = ""; return; }
      api("/api/people?view=all&q=" + encodeURIComponent(q)).then(function (r) {
        $("l-list").innerHTML = r.rows.slice(0, 8).map(function (x) {
          return '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line2)"><span><b>' + esc(x.handle) + '</b> <span class="muted">' + esc(x.sub) + '</span><div class="hint">' + esc((x.cells[0] || {}).v || "") + '</div></span><button class="btn sm" data-pick="' + esc(x.id) + '">就是她</button></div>';
        }).join("") || '<div class="muted" style="padding:8px 0">没找到，换个关键词</div>';
        all("[data-pick]").forEach(function (b) {
          b.onclick = function () {
            closeModal();
            later(c.id, "已关联，这封信会排回她的卡片", function () { return post("/api/mail-link", { id: c.id.slice(8), followup: b.getAttribute("data-pick") }); });
          };
        });
      });
    }, 300);
  };
  $("l-q").focus();
}

function newsBlock() {
  var n = state.news;
  if (!n || (!n.chips.length && !n.items.length)) return "";
  var chips = n.chips.map(function (c) { return '<span class="badge ' + (c.tone === "ok" ? "b-ok" : "") + '">' + esc(c.label) + " " + c.n + "</span>"; }).join(" ");
  var items = n.items.map(function (i) {
    return '<div style="display:flex;gap:12px;padding:6px 0;border-top:1px solid var(--line2)"><span class="muted tiny" style="width:120px;flex:0 0 auto">' + esc(i.when) + '</span><span style="flex:1">' + esc(i.text) + '</span>' +
      (safeUrl(i.link) ? '<a class="tiny" href="' + esc(safeUrl(i.link)) + '" target="_blank" rel="noopener">帖子 ↗</a>' : "") + (i.person ? '<a class="tiny" href="#/person/' + esc(i.person) + '">看</a>' : "") + '</div>';
  }).join("");
  return '<details class="card" style="padding:10px 16px"' + (visibleCards().length ? "" : " open") + '><summary style="font-size:14px;color:var(--ink)"><b>你不在时发生的</b> <span class="muted small">' + esc(n.since) + ' 以后 · 不用你处理</span> ' + chips + '</summary>' + items + '</details>';
}

function convoHtml(p, full) {
  var list = (full ? p.bubbles : p.bubbles.slice(-6)).map(function (b) {
    if (b.side === "event") return '<div class="event">' + esc(b.when.slice(0, 10) + " · " + b.text) + "</div>";
    return '<div class="' + b.side + '"><div class="who">' + esc(b.who + " · " + b.when) + "</div>" + esc(!full && b.text.length > 220 ? b.text.slice(0, 220) + "…" : b.text) + "</div>";
  }).join("");
  return list ? '<div style="display:flex;flex-direction:column;gap:8px">' + list + "</div>" : '<div class="muted small">还没有来往</div>';
}
function loadConvo(fid) {
  var box = $("convo");
  if (!box) return;
  var cached = state.convo[fid];
  if (cached) { box.innerHTML = convoHtml(cached); return; }
  box.innerHTML = '<div class="muted small">读取最近的来往…</div>';
  api("/api/person?id=" + encodeURIComponent(fid)).then(function (p) {
    state.convo[fid] = p;
    var now = $("convo");
    if (now && now.getAttribute("data-fid") === fid) now.innerHTML = convoHtml(p);
  }).catch(function () { var now = $("convo"); if (now) now.innerHTML = '<div class="muted small">读不到来往记录</div>'; });
}

/** The middle column: what happened, in the card's own terms (4.1.2, 4.1.3). */
function infoHtml(c) {
  var head = '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="badge ' + tagClass(c) + '">' + esc(c.tag) + '</span>' +
    (c.send && c.send.byHand ? '<span class="badge">要你自己发</span>' : "") +

    '<div class="muted small">' + esc([c.meta, c.send ? "收件 " + c.send.to + " · 从 " + c.send.from : ""].filter(Boolean).join(" · ")) + '</div>';
  var parts = [head];
  if (c.returned) parts.push('<div class="confirm" style="gap:2px"><b>退回来重新看的原因</b><div class="small">' + esc(c.returned) + "</div></div>");
  if (c.kind === "problem") {
    parts.push('<div><div class="lbl">发生了什么</div><div style="white-space:pre-wrap">' + esc(c.why) + "</div></div>");
    if (c.unknownSend) parts.push('<div><div class="lbl">去哪里核对</div><ol class="steps"><li>打开发信邮箱的「已发送」，搜这封信的主旨</li><li>找到了：点「确认已经发出」' + (c.codeAction ? "，顺便填上后台看到的码名" : "") + '</li><li>没找到：点「确认没发出，重新审核」，你再同意一次才会发</li></ol></div>');
    else if (c.unknownCode && c.codeAction === "延期") parts.push('<div><div class="lbl">去哪里核对</div><ol class="steps"><li>打开项目后台的体验码列表，搜这个码</li><li>看到期日变没变</li></ol></div>' +
      '<div class="two"><div class="card" style="flex:1 1 200px;padding:12px 14px"><div class="lbl">已经延期了</div><div class="small">点「不做了，撤掉」，再到她的页面写信告诉她新的到期日。到期日下次同步会更新到跟进上。</div></div>' +
      '<div class="card" style="flex:1 1 200px;padding:12px 14px"><div class="lbl">没延期</div><div class="small">点「确认没做成，重新审核」，这件事回到待你决定，你再同意一次才会延期并发信。</div></div></div>');
    else if (c.unknownCode) parts.push('<div class="suggest"><div class="lbl" style="color:var(--blue2)">怎么处理</div><div>' + esc(c.codeAction) + '的请求重复发不会建出第二个（后台会原样返回第一次建的），直接点「确认没做成，重新审核」，再同意一次就行。信还没发出去。</div></div>');
  } else {

      parts.push('<div class="card" style="padding:14px 16px;display:flex;flex-direction:column;gap:8px"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px"><b>体验码 ' + esc(c.trial.code) + '</b><span class="hint">' + esc(c.trial.expired ? c.trial.expired + " 到期" : "") + '</span></div>' +
        (c.trial.max ? '<div class="bar" role="img" aria-label="已用 ' + c.trial.used + " / " + c.trial.max + '"><div style="width:' + pct + '%"></div></div><div class="small">已用 ' + c.trial.used + " / " + c.trial.max + "</div>" : '<div class="small muted">用量不知道</div>') +
        '<div class="hint">' + esc(c.why) + "</div></div>");
    } else {
      parts.push('<div class="suggest"><div class="lbl" style="color:var(--blue2)">' + (c.kind === "bounce" ? "为什么没有自动结案" : "建议") + '</div><div style="font-weight:600">' + esc(c.kind === "bounce" ? c.why : c.suggest) + '</div>' +
        (c.why && c.kind !== "bounce" ? '<div class="small muted" style="white-space:pre-wrap">' + esc(c.why) + "</div>" : "") + "</div>");
    }
    if (c.kind === "bounce") parts.push('<div><div class="lbl">退回的地址</div><div style="font-family:ui-monospace,Menlo,monospace">' + esc(c.bounced || "") + "</div></div>");
    if (c.kind === "overdue") parts.push('<div class="timeline">' + (c.asked ? "<div><span>问过</span><span>从约定日期起发出 " + c.asked + " 封问发布的信，她都没发</span></div>" : "") + "<div><span>每天</span><span>系统看她最近的帖子，找提到项目识别词或活动码的</span></div></div>");
    if (c.template && c.template.missing) parts.push('<div class="confirm" style="gap:2px"><b>模板表里找不到「' + esc(c.template.name) + '」</b><div class="small">这一批说要用的模板不存在或改过名字。先在设置的模板里确认，再同意这一批。</div></div>');
    else if (c.template) parts.push('<div><div class="lbl">用的模板「' + esc(c.template.name) + '」，填进一位 KOL 的样子</div><div class="quote" style="font-size:14px"><b>' + fillSample(c.template.subject) + "</b>\n\n" + fillSample(c.template.body) + "</div></div>");
    if (c.invite) parts.push('<div class="confirm blue" style="gap:2px"><b>现在同意只记下同意</b><div class="small">还要在 Claude 里说「发这批邀约」才会真正发出（切换到新数据库后，同意即排队）。</div></div>');
    if (c.kind === "template" && c.draft) parts.push('<div><div class="lbl">填进一位 KOL 的样子（示例值）</div><div class="quote" style="font-size:14px"><b>' + fillSample(c.draft.subject) + "</b>\n\n" + fillSample(c.draft.body) + "</div></div>");
    if (c.mail) parts.push('<div><div class="lbl">' + esc(c.mail.label) + (c.mail.when ? " · " + esc(c.mail.when) : "") + '</div><div class="quote">' + esc(c.mail.text) + "</div></div>");
  }
  if (c.who) parts.push('<div><div style="display:flex;justify-content:space-between;gap:8px"><span class="lbl">最近的来往</span><a class="small" href="#" id="convo-all">看全部</a></div><div id="convo" data-fid="' + esc(c.who.id) + '"></div></div>');
  return parts.join("");
}

function renderDecide() {
  var o = state.overview, cards = visibleCards();
  if (state.focus) {
    var at = cards.findIndex(function (x) { return x.id === state.focus; });
    if (at >= 0) state.idx = at;
    state.focus = "";
  }
  if (state.idx >= cards.length) state.idx = Math.max(0, cards.length - 1);
  var c = cards[state.idx];
  renderCount();
  renderBanners();
  var oldList = document.querySelector(".dlist");
  var listScroll = oldList ? oldList.scrollTop : 0;
  var top = '<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:baseline"><div style="display:flex;gap:12px;align-items:baseline;flex-wrap:wrap"><h1 style="margin:0;font-size:20px">' + (cards.length ? "有 " + cards.length + " 件要你决定" : "今天的事都处理完了") + '</h1>' +
    (o.waitingClaude ? '<span class="muted small">另有 ' + o.waitingClaude + ' 件在等 Claude 按你的意见重写（在 Claude 里说「改退回的草稿」）</span>' : "") + '</div>' +
    '<span class="muted tiny">J / K 上下一件 · A 主按钮 · R 让 Claude 改 · D 不做了 · S 跳过 · Z 撤销</span></div><div id="news">' + newsBlock() + '</div>';
  if (!c) {
    $("app").innerHTML = '<div class="narrow">' + top + '<section class="card" style="padding:40px 24px;text-align:center;border-style:dashed"><div style="font-size:20px;font-weight:700">今天的事都处理完了</div><div class="muted small" style="margin-top:4px">同意的事在后台执行，结果看右上角。新来信和 Claude 准备好的草稿会自动排进来。</div><a href="#/people/wait" class="small">去 KOL 列表</a></section></div>';
    return;
  }

  var list = "", lastGroup = "";
  var waiting = o.cards.filter(function (x) { return state.handled[x.id] === "pending"; });
  var collapsed = state.collapsed || (state.collapsed = {});
  cards.forEach(function (x, i) {
    if (x.group !== lastGroup) {
      var n = cards.filter(function (y) { return y.group === x.group; }).length;
      list += '<button class="dgroup" data-group="' + esc(x.group) + '" aria-expanded="' + !collapsed[x.group] + '" style="width:100%;border:0;background:transparent;cursor:pointer;font:inherit;font-size:12px;font-weight:600;color:var(--muted)">' + (collapsed[x.group] ? "▸ " : "▾ ") + esc(x.group) + ' <span>' + n + '</span></button>';
      lastGroup = x.group;
      waiting.filter(function (w) { return w.group === x.group; }).forEach(function (w) {
        list += '<div class="ditem" style="opacity:.5;cursor:default"><span class="badge">' + esc(w.tag) + '</span><span class="dtitle">' + esc(w.headline) + '</span><span class="dmeta">5 秒后执行 · 按 Z 撤销</span></div>';
      });
    }
    if (collapsed[x.group] && i !== state.idx) return;
    list += '<button class="ditem' + (i === state.idx ? " on" : "") + '" data-i="' + i + '"><span class="badge ' + tagClass(x) + '">' + esc(x.tag) + '</span><span class="dtitle">' + esc(x.headline) + '</span>' + (x.meta ? '<span class="dmeta">' + esc(x.meta) + '</span>' : "") + '</button>';
  });

  var changing = state.changing && ["reply", "batch", "template", "todo"].indexOf(c.kind) >= 0 && c.kind !== "template";
  var pn = pane(c);
  var next = cards[state.idx + 1];
  var actionPane;
  if (changing) {
    actionPane = '<div style="display:flex;flex-direction:column;gap:12px"><b style="font-size:16px">让 Claude 改</b>' +
      '<label class="field"><span>哪里要改？</span><textarea class="input" id="change-note" rows="4" placeholder="比如：语气轻一点，不要提分润比例；或者：不要结案，改成下个月再问"></textarea></label>' +
      '<button class="btn big primary" id="to-claude">交给 Claude 重写</button><button class="btn" id="cancel-change">返回 <span class="kbd">Esc</span></button>' +
      '<div class="hint">交给 Claude 后，这件先离开队列。在 Claude 里说「改退回的草稿」，改好的会排回这里，你再看一遍。</div>' +
      (c.draft ? '<div><div class="lbl">现在的草稿</div><div class="quote" style="font-size:13px;max-height:320px;overflow:auto">' + esc(c.draft.body) + '</div></div>' : "") + '</div>';
  } else {
    var acts = pn.acts, more = acts.slice(1);
    var steps = pn.steps && pn.steps.length ? '<div><div class="lbl">' + esc(pn.stepsLabel || "可以这样处理") + '</div><ol class="steps">' + pn.steps.map(function (s) { return "<li" + (/^(标成永不联系，)?结束跟进（原因/.test(s.text) ? ' id="after-step"' : "") + ">" + esc(s.text) + "</li>"; }).join("") + "</ol></div>" : "";
    actionPane = '<div><div class="lbl">要你定什么</div><div style="font-weight:600">' + esc(pn.ask) + '</div></div>' + steps + pn.body +
      (acts.length ? '<button class="btn big primary" data-act="0">' + esc(acts[0].label) + ' <span class="kbd">' + acts[0].key + '</span></button>' : "") +
      '<div class="drow">' + more.map(function (a, i) {
        return '<button class="btn' + (a.danger ? " text danger" : "") + '"' + (a.danger ? ' style="margin-left:auto"' : "") + ' data-act="' + (i + 1) + '">' + esc(a.label) + ' <span class="kbd">' + a.key + '</span></button>';
      }).join("") + '<button class="btn" id="skip" title="先放着，看下一件">跳过 <span class="kbd">S</span></button></div>' + pn.after +
      '<div class="hint">' + (next ? "下一件：" + esc(next.headline) : "这是最后一件") + '</div>';
  }

  // Narrow screens: the queue folds into a 「第 3 / 90 件」 picker above the card (4.1.1).
  var pick = '<div class="dpick card" style="padding:8px 12px;gap:8px;align-items:center"><button class="btn sm" data-move="-1" aria-label="上一件">‹</button><select class="input" id="dpick" style="flex:1;min-width:0">' +
    cards.map(function (x, i) { return '<option value="' + i + '"' + (i === state.idx ? " selected" : "") + ">第 " + (i + 1) + " / " + cards.length + " 件 · " + esc(x.group) + " · " + esc(x.headline.slice(0, 40)) + "</option>"; }).join("") +
    '</select><button class="btn sm" data-move="1" aria-label="下一件">›</button></div>';
  $("app").innerHTML = '<div style="display:flex;flex-direction:column;gap:12px">' + top + pick +
    '<div class="dgrid">' +
      '<nav class="card dlist" aria-label="待你决定的事">' + list + '</nav>' +
      '<section class="card dinfo" aria-label="这件事">' + infoHtml(c) + '</section>' +
      '<section class="card dact" aria-label="怎么处理">' + actionPane + '</section>' +
    '</div></div>';

  if (!changing) { keepEdits(c); if (pn.wire) pn.wire(); }
  var newList = document.querySelector(".dlist");
  if (newList) newList.scrollTop = listScroll;
  var on = document.querySelector(".ditem.on");
  if (on && newList && (on.offsetTop < newList.scrollTop || on.offsetTop > newList.scrollTop + newList.clientHeight - 60)) newList.scrollTop = on.offsetTop - 80;
  all("[data-i]").forEach(function (b) {
    b.addEventListener("click", function () { state.idx = Number(b.getAttribute("data-i")); state.changing = false; renderDecide(); });
  });
  all("[data-group]").forEach(function (b) { b.addEventListener("click", function () { var g = b.getAttribute("data-group"); state.collapsed[g] = !state.collapsed[g]; renderDecide(); }); });
  all("[data-act]").forEach(function (b) { b.addEventListener("click", function () { pn.acts[Number(b.getAttribute("data-act"))].run(); }); });
  if ($("skip")) $("skip").addEventListener("click", function () { move(1); });
  if ($("dpick")) $("dpick").addEventListener("change", function () { state.idx = Number($("dpick").value); state.changing = false; renderDecide(); });
  all("[data-move]").forEach(function (b) { b.addEventListener("click", function () { move(Number(b.getAttribute("data-move"))); }); });
  if (changing) {
    $("cancel-change").addEventListener("click", function () { state.changing = false; renderDecide(); });
    $("to-claude").addEventListener("click", function () {
      var note = $("change-note").value.trim();
      if (!note) { toast("写一句哪里要改，Claude 才知道怎么改", { bad: true }); return; }
      state.changing = false;
      later(c.id, "已交给 Claude 重写：" + who(c), function () { return post("/api/revise", { id: c.id, note: note }); });
    });
  }
  if (c.who) loadConvo(c.who.id);
  // 看全部 opens every message in place instead of leaving the card (4.1.2).
  if ($("convo-all")) $("convo-all").addEventListener("click", function (e) {
    e.preventDefault();
    $("convo").innerHTML = '<div class="muted small">读取全部来往…</div>';
    api("/api/person?id=" + encodeURIComponent(c.who.id) + "&all=1").then(function (p) {
      // Only into the card it was asked for: another card may be open by now.
      var box = $("convo");
      if (box && box.getAttribute("data-fid") === c.who.id) { box.innerHTML = convoHtml(p, true); if ($("convo-all")) $("convo-all").hidden = true; }
    }).catch(function () {});
  });
  state.current = { card: c, acts: changing ? [] : pn.acts };
}
function move(d) {
  var n = visibleCards().length;
  if (!n) return;
  state.idx = (state.idx + d + n) % n;
  state.changing = false;
  renderDecide();
  window.scrollTo(0, 0);
}
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape") {
    if (!$("drawer").hidden) return closeDrawer();
    if (!$("modal").hidden) return closeModal();
  }
  if (!$("drawer").hidden || !$("modal").hidden) return;
  if (location.hash && location.hash.indexOf("#/?") !== 0 && location.hash !== "#/" && location.hash !== "#") return;
  // While writing what Claude should change, only Esc (back) works.
  if (state.changing) { if (e.key === "Escape") { state.changing = false; renderDecide(); } return; }
  if (e.target.closest && e.target.closest("input,textarea,select")) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  var k = e.key.toLowerCase();
  if (k === "z" && toastState.undo) { e.preventDefault(); var u = toastState.undo; hideToast(); u(); return; }
  var cur = state.current && state.current.card;
  if (cur && cur.kind === "overdue" && (k === "1" || k === "2")) { state.posted[cur.id] = k === "2"; renderDecide(); return; }
  if (k === "j" || k === "s") return move(1);
  if (k === "k") return move(-1);
  if (!state.current) return;
  var hit = state.current.acts.find(function (a) { return a.key.toLowerCase() === k; });
  if (hit) { e.preventDefault(); hit.run(); }
});

// --- F-01 写信给她 ---
/** The write panel; from a bounce card (`o.card`) the bounce is handled only once the mail is queued (C-12). */
function openWrite(fid, o) {
  o = o || {};
  api("/api/person?id=" + encodeURIComponent(fid)).then(function (p) {
    var sf = p.sendFrom || { channel: "", usual: "", mailboxes: [] };
    var fromBox = '<label class="field"><span>从哪个邮箱发</span><select class="input" id="w-from">' + (sf.usual ? "" : '<option value="">请选择</option>') +
      sf.mailboxes.map(function (m) { return '<option value="' + esc(m) + '"' + (m === sf.usual ? " selected" : "") + ">" + esc(m) + (m === sf.usual ? "（她一直跟这个邮箱联系）" : "") + "</option>"; }).join("") + "</select>" +
      '<span class="hint" id="w-from-hint">' + (sf.usual ? "" : "她一直是跟「" + esc(sf.channel || "未填") + "」联系的，这个邮箱系统发不了。换一个邮箱发，她看到的发件人会变。") + "</span></label>";
    var usable = p.emails.filter(function (e) { return !e.blocked && !e.bounced; }), blocked = p.emails.filter(function (e) { return e.blocked || e.bounced; });
    var toBox = '<label class="field"><span>发到哪个邮箱</span><select class="input" id="w-to">' + usable.map(function (e, i) {
      var sel = o.to ? e.address === o.to : i === 0;
      return '<option value="' + esc(e.address) + '"' + (sel ? " selected" : "") + ">" + esc(e.address) + (e.address === (p.emails[0] || {}).address ? "（默认）" : "") + "</option>";
    }).join("") + "</select>" + (blocked.length ? '<span class="hint">' + esc(blocked.map(function (e) { return e.address + (e.bounced ? "（退过信）" : "（永不联系）"); }).join("、")) + " 不在列表里</span>" : "") + "</label>";
    var held = p.heldMail ? '<div class="confirm" style="gap:2px"><b>她已经有一封待发或没发成的信「' + esc(p.heldMail) + '」</b><div class="small">同一时间只能有一封。先在「待你决定」或「出了问题」里处理那一封。</div></div>' : "";
    drawer("写信给 " + p.name, (o.card ? '<div class="hint">新邮箱已加到她的档案。信排进队列后，退信卡才算处理完；取消写信，退信卡留着。</div>' : "") +
      '<div class="hint">点「发出」就算你同意了，按额度排队发出，5 秒内可以撤销。</div>' + held + fromBox + toBox +
      '<label class="field"><span>主旨</span><input class="input" id="w-subject" placeholder="回复她上一封信时可以不填"></label>' +
      '<label class="field"><span>正文</span><textarea class="input" id="w-body" rows="12" autofocus></textarea></label>',
      '<button class="btn" id="w-cancel">取消</button><button class="btn primary" id="w-send"' + (held ? " disabled" : "") + '>发出</button>',
      { ask: "放弃这封信？" });
    var wire = function () {
      $("w-cancel").onclick = function () { closeDrawer(); };
      $("w-send").onclick = function () {
        var from = $("w-from").value, to = ($("w-to") || {}).value || "", subject = $("w-subject").value, body = $("w-body").value;
        if (!from) { toast("先选从哪个邮箱发", { bad: true }); return; }
        if (!to) { toast("她的档案里没有能用的邮箱", { bad: true }); return; }
        if (!body.trim()) { toast("信是空的", { bad: true }); $("w-body").focus(); return; }
        closeDrawer(true);
        var req = { id: fid, subject: subject, body: body, from: from, to: to };
        var then = function (r) { toast(r.job ? "已排队从 " + from + " 发给 " + to + "，结果看右上角" : "现在暂停着：已经记下，恢复发送后从 " + from + " 发出"); if (o.after) o.after(); };
        if (o.card) {
          req.answers = o.card.id.slice(7);
          later(o.card.id, "5 秒后发给 " + to, function () { return post("/api/write", req); }, then);
        } else delayed("5 秒后发给 " + to, function () { return post("/api/write", req); }, then);
      };
      $("w-from").onchange = function () {
        $("w-from-hint").textContent = sf.usual && $("w-from").value !== sf.usual ? "换邮箱的话，她看到的发件人会变" : "";
        $("w-from-hint").style.color = "var(--warn)";
      };
    };
    drawerState.rewire = wire;
    wire();
  }).catch(function (e) { failToast("打不开写信：", e); });
}

    var problems = function () {

        var req = { platform: $("f-platform").value, keywords: $("f-keywords").value, seeds: $("f-seeds").value, minFollowers: $("f-min").value, maxFollowers: $("f-max").value, budget: $("f-budget").value, batch: $("f-batch").value.trim(), target: $("f-target").value };
        if (!req.batch) { $("f-batch").classList.add("bad"); $("f-batch-hint").className = "hint bad"; $("f-batch-hint").textContent = "要写一个入库批次"; $("f-batch").focus(); return; }

function renderLog() {

    var runningRuns = l.runs.filter(function (r) { return r.result === "进行中"; });
    var mins = function (ms) { var n = Math.max(0, Math.round((Date.now() - ms) / 60000)); return n < 1 ? "刚开始" : "已进行 " + n + " 分钟"; };
    var running = jobs.map(function (j) { return '<div class="small"><span class="badge b-warn">' + esc(j.state) + "</span> " + esc(j.what) + ' <span class="hint">· ' + mins(j.at) + (j.note ? " · " + esc(j.note) : "") + "</span></div>"; }).join("") +
      runningRuns.map(function (r) { return '<div class="small"><span class="badge b-warn">进行中</span> ' + esc(r.title) + " · " + esc(r.start.slice(11)) + " 开始</div>"; }).join("") +
      o.status.items.filter(function (i) { return i.st === "等发出"; }).map(function (i) { return '<div class="small"><span class="badge b-blue">' + (state.paused ? "暂停中，排着" : "等发出") + "</span> " + esc(i.text) + "</div>"; }).join("");
    var problems = o.cards.filter(function (c) { return c.kind === "problem"; });
    var bad = problems.map(function (c) { return '<a href="#/?card=' + encodeURIComponent(c.id) + '" class="small" style="display:flex;gap:8px;align-items:center"><span class="badge b-bad">' + esc(c.tag) + "</span>" + esc(c.headline) + ' <span style="margin-left:auto">去处理 →</span></a>'; }).join("");
    var opsOf = {};
    l.ops.forEach(function (x) { (opsOf[x.run || ""] = opsOf[x.run || ""] || []).push(x); });
    // Runs that send mail, and log lines that record a sent mail.
    var isMail = function (t) { return /^(发出已批准的信|发邀约|催信和结案)/.test(t); };
    var isMailOp = function (x) { return x.type === "发出邮件" || /^(发出|已发|回复|邀约|催信)/.test(x.what); };

      if (f === "mail") return isMail(r.title);

      return true;
    }).map(function (r) {
      var cls = r.result === "完成" ? "b-ok" : r.result === "进行中" ? "b-warn" : r.result === "失败" ? "b-bad" : "b-warn";
      var ops = (opsOf[r.id] || []).filter(function (x) { return (f !== "failed" || /失败|退信|不明/.test(x.result)) && (f !== "mail" || isMailOp(x)); });
      var detail = ops.length ? '<details><summary>' + ops.length + " 条操作明细</summary>" + ops.map(function (x) {
        return '<div class="small" style="padding:3px 0;display:flex;gap:8px"><span class="muted" style="flex:0 0 44px">' + esc(x.when.slice(11)) + "</span><span>" + esc(x.what) + (x.note ? ' <span class="muted">· ' + esc(x.note) + "</span>" : "") + '</span><span class="badge ' + (/完成|送达/.test(x.result) ? "b-ok" : /失败|退信/.test(x.result) ? "b-bad" : "") + '" style="margin-left:auto">' + esc(x.result) + "</span></div>";
      }).join("") + "</details>" : "";
      return "<tr><td class=\"muted\" style=\"white-space:nowrap\">" + esc(r.start.slice(5)) + (r.end ? "–" + esc(r.end) : "") + "</td><td><b>" + esc(r.title) + "</b>" + (r.counts ? ' <span class="muted small">· ' + esc(r.counts) + "</span>" : "") +
        (r.notes ? '<div class="tone-bad small">' + esc(r.notes) + "</div>" : "") + detail + '</td><td class="muted small">' + esc(r.how === "定时任务" ? "每天例行" : "在 Claude 或决策台里跑的") + '</td><td><span class="badge ' + cls + '">' + esc(r.result) + "</span></td></tr>";
    }).join("");
    var loose = (opsOf[""] || []).filter(function (x) { return f === "all" || (f === "today" && x.when.slice(0, 10) === todayKey) || (f === "failed" && /失败|退信|不明/.test(x.result)) || (f === "mail" && isMailOp(x)); });
    var chips = [["all", "全部"], ["failed", "只看没做成的"], ["mail", "只看发信"], ["today", "只看今天"]].map(function (x) { return '<button class="chip' + (f === x[0] ? " on" : "") + '" data-f="' + x[0] + '">' + x[1] + "</button>"; }).join("");
    $("app").innerHTML = '<div style="display:flex;flex-direction:column;gap:14px;max-width:1280px;margin:0 auto"><div><h1 style="margin:0;font-size:22px">执行记录</h1><div class="muted">最近 3 天系统做过的事，最新的在最上面</div></div>' +
      '<div class="two"><section class="card" style="flex:1 1 360px;padding:14px 16px;display:flex;flex-direction:column;gap:8px"><b>正在执行</b>' + (running || '<div class="muted small">现在没有在执行的事</div>') + "</section>" +
      '<section class="card" style="flex:1 1 360px;padding:14px 16px;display:flex;flex-direction:column;gap:8px"><b' + (problems.length ? ' style="color:var(--bad)"' : "") + ">没做成和结果不明 · " + problems.length + "</b>" + (bad || '<div class="muted small">没有</div>') + "</section></div>" +
      '<div class="drow">' + chips + "</div>" +
      '<section class="card" style="overflow-x:auto"><table style="min-width:760px"><thead><tr><th>时间</th><th>做了什么</th><th>谁让做的</th><th>结果</th></tr></thead><tbody>' + (runs || '<tr><td colspan="4" class="muted">这个筛选下没有运行记录</td></tr>') + "</tbody></table></section>" +
      (loose.length ? '<section class="card" style="padding:14px 16px"><b>不属于哪次运行的操作</b>' + loose.slice(0, 100).map(function (x) {
        return '<div class="small" style="padding:4px 0;border-top:1px solid var(--line2);display:flex;gap:8px"><span class="muted" style="flex:0 0 90px">' + esc(x.when.slice(5)) + "</span><span>" + esc(x.what) + (x.note ? ' <span class="muted">· ' + esc(x.note) + "</span>" : "") + '</span><span class="badge" style="margin-left:auto">' + esc(x.result) + "</span></div>";
      }).join("") + "</section>" : "") + "</div>";
    all("[data-f]").forEach(function (b) { b.onclick = function () { state.logFilter = b.getAttribute("data-f"); renderLog(); }; });
  }).catch(fail);

        '<div><div class="hint" style="margin-bottom:6px">可以用的占位符，点一下插入</div><div class="drow" id="tpl-tokens"></div></div>' +
        '<label class="field"><span>这次改了什么</span><input class="input" id="tpl-why" placeholder="例如：语气更轻一点"></label></section>' +
      '<section class="card" style="flex:1 1 380px;min-width:0;padding:18px 20px;display:flex;flex-direction:column;gap:12px"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><b>预览</b><label style="margin-left:auto;display:flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap">填进<select class="input" id="tpl-who" style="width:160px;min-height:32px;padding:4px 8px">' +
        people.map(function (p) { return '<option value="' + esc((p.sub.split(" · ")[0] || p.handle).replace(/^@/, "")) + '">' + esc(p.handle) + "</option>"; }).join("") + "</select>看看</label></div>" +
        '<div style="border:1px solid var(--line2);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:8px"><div class="hint">主旨</div><div style="font-weight:600" id="pv-subject"></div><div class="hint" style="margin-top:6px">正文</div><div style="white-space:pre-wrap" id="pv-body"></div></div>' +
        (t.active ? '<details><summary>和在用的版本比较</summary><div class="hint" style="margin-top:6px">主旨：' + esc(t.active.subject) + '</div><div class="quote" style="font-size:13px;margin-top:6px">' + esc(t.active.body) + "</div></details>" : t.state === "已批准" ? '<div class="hint">现在显示的就是在用的版本</div>' : "") + "</section></div>" +
      '<div id="set-foot" class="card" style="position:sticky;bottom:12px;padding:12px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap"><span class="hint" id="tpl-saved">' + (isNew ? "还没保存" : "") + "</span>" +
        (["草稿", "待审核"].indexOf(t.state) >= 0 && !isNew ? '<button class="btn" id="tpl-discard" style="margin-left:auto">放弃草稿</button>' : '<span style="margin-left:auto"></span>') +
        '<button class="btn" id="tpl-save">存草稿</button><button class="btn primary" id="tpl-submit">提交审核</button></div><div id="tpl-confirm" hidden></div>';
    var sample = { 账号名称: "deer_lu", 體驗碼: "deer_lu", 体验码: "deer_lu", 已用: "1", 剩餘: "2", 剩余: "2", 次數: "3", 次数: "3", 到期日: "11 月 10 日", "已於 / 將於": "將於", "M 月 D 日": "11 月 10 日", 約定日期: "11 月 15 日", 约定日期: "11 月 15 日", 活動碼: "deer_tafu", 活动码: "deer_tafu", 專屬連結: "https://tafu.me/p/deer", 专属连结: "https://tafu.me/p/deer" };
    var purpose = function () { return isNew ? $("tpl-purpose").value : t.purpose; };
    var paint = function () {
      var hs = holdersFor(purpose()), name = $("tpl-who").value || "小鹿";
      $("tpl-tokens").innerHTML = hs.filter(function (h, i) { return hs.indexOf(h) === i; }).map(function (h) { return '<button class="chip" data-tok="' + esc(h) + '">{' + esc(h) + "}</button>"; }).join("");
      all("[data-tok]").forEach(function (b) { b.disabled = locked; b.onclick = function () { if (locked) return; var ta = $("tpl-body"), at = ta.selectionStart || ta.value.length; ta.value = ta.value.slice(0, at) + "{" + b.getAttribute("data-tok") + "}" + ta.value.slice(at); ta.focus(); ta.dispatchEvent(new Event("input")); }; });
      var bad = [];
      var fill = function (s) {
        return esc(s).replace(/\{([^{}\n]+)\}/g, function (whole, k) {
          k = k.trim();
          if (hs.indexOf(k) < 0) { if (bad.indexOf(whole) < 0) bad.push(whole); return '<span style="background:var(--bad-bg);color:var(--bad);padding:0 3px;border-radius:3px">' + whole + "</span>"; }
          return '<span style="background:var(--blue-bg);color:var(--blue2);padding:0 3px;border-radius:3px">' + esc(k === "稱呼" || k === "称呼" ? name : sample[k] || k) + "</span>";
        });
      };
      $("pv-subject").innerHTML = fill($("tpl-subject").value);
      $("pv-body").innerHTML = fill($("tpl-body").value);
      $("tpl-bad").textContent = bad.length ? "正文里的 " + bad.join("、") + " 系统不认识，发信时会填不上。改掉或删掉才能提交。" : "";
      $("tpl-submit").disabled = locked || bad.length > 0 || !$("tpl-body").value.trim();
    };
    // Everything below works on this editor's own elements: another template opened later has its own.
    var subjEl = $("tpl-subject"), bodyEl = $("tpl-body"), whyEl = $("tpl-why");
    var dirty = false, edits = 0, inflight = Promise.resolve(), closed = false, locked = false;
    var touched = function () { dirty = true; edits++; setDirty(1); $("tpl-saved").textContent = "有修改没保存"; paint(); };
    ["tpl-subject", "tpl-body"].forEach(function (x) { $(x).addEventListener("input", touched); });
    if (isNew) ["tpl-name", "tpl-lang", "tpl-dir"].forEach(function (x) { $(x).addEventListener("input", touched); });
    if (isNew) $("tpl-purpose").addEventListener("change", touched);
    $("tpl-who").addEventListener("change", paint);
    paint();
    // Saves go one after another; each clears 「没保存」 only if nothing was typed while it was on its way.
    var save = function () { var run = inflight.then(saveNow, saveNow); inflight = run.catch(function () {}); return run; };
    var saveNow = function () {
      if (closed) return Promise.resolve(t.id);
      var at = edits;
      var body = { id: t.id, subject: subjEl.value, body: bodyEl.value, why: whyEl.value };
      if (isNew) { body.name = $("tpl-name").value; body.purpose = $("tpl-purpose").value; body.language = $("tpl-lang").value; body.direction = $("tpl-dir").value; }
      return post("/api/settings/template", body).then(function (x) {
        // A new template exists from its first save: later saves update it instead of making another.
        // Whatever happens next, the editor knows the state the server left it in.
        if (x.state) t.state = x.state;
        if (x.id && !t.id) {
          t.id = x.id; isNew = false;
          // Name, purpose, language and direction are set by the first save; the editor shows that they are now fixed.
          t.name = body.name; t.purpose = body.purpose;
          ["tpl-name", "tpl-purpose", "tpl-lang", "tpl-dir"].forEach(function (k) { if ($(k)) $(k).disabled = true; });
          if ($("tpl-title")) $("tpl-title").textContent = t.name;
        }
        if (edits !== at) return x.id;
        dirty = false; setDirty(0);
        $("tpl-saved").textContent = "草稿已保存 " + timeOf(Date.now());
        // The address follows the template without reloading the editor; an approved one is a draft from now on.
        if (location.hash !== "#/settings/templates/" + x.id) history.replaceState(null, "", "#/settings/templates/" + x.id);
        // (t.state was set from the answer above: a save with no change leaves an approved template approved.)
        return x.id;
      });
    };
    // Autosave applies to a template already in draft; an approved one only becomes a draft when 存草稿 is pressed.
    var timer = 0;
    var startTimer = function () {
      clearInterval(timer);
      timer = setInterval(function () {
        if (!document.body.contains(bodyEl)) { dirty = false; return clearInterval(timer); }
        if (dirty && !isNew && t.state === "草稿") save().catch(function () {});
      }, 15000);
    };
    startTimer();
    var lock = function (on) {
      locked = on;
      [subjEl, bodyEl, whyEl].forEach(function (el) { el.readOnly = on; });
      ["tpl-save", "tpl-submit", "tpl-discard"].forEach(function (k) { if ($(k)) $(k).disabled = on; });
      all("[data-tok]").forEach(function (b) { b.disabled = on; });
    };
    $("tpl-save").onclick = function () {
      if (t.state === "已批准" && dirty) {
        inlineConfirm($("tpl-confirm"), { title: "存草稿后，在用的版本会暂停到新版本批准为止", ok: "存草稿", body: '<div class="small">会停的事：' + esc(t.stops || "") + "</div>",
          run: function () { save().then(function () { toast("草稿已保存"); }).catch(function (e) { failToast("没保存：", e); }); } });
        return;
      }
      save().then(function () { toast("草稿已保存"); }).catch(function (e) { failToast("没保存：", e); });
    };
    $("tpl-submit").onclick = function () {
      // Save until what is on screen is what is stored, then submit; a failure leaves the editor working.
      var settle = function () { return (dirty || !t.id ? save() : inflight).then(function () { return dirty ? settle() : t.id; }); };
      // Nothing can be typed while it is being submitted, so what is submitted is what is on screen.
      lock(true);
      settle().then(function (nid) {
        closed = true; clearInterval(timer);
        return post("/api/settings/template-submit", { id: nid });
      }).then(function () { dirty = false; toast("已提交审核，到「待你决定」里批准"); setDirty(0); location.hash = "#/settings/templates"; })
        .catch(function (e) { closed = false; lock(false); startTimer(); paint(); failToast("没提交：", e); });
    };
    if ($("tpl-discard")) $("tpl-discard").onclick = function () {
      inlineConfirm($("tpl-confirm"), { title: t.active ? "放弃草稿，恢复用编辑前的版本？" : "放弃草稿？这个模板没有在用的版本，会停用", ok: "放弃草稿",
        run: function () { closed = true; lock(true); inflight.then(function () { return post("/api/settings/template-discard", { id: t.id }); }).then(function (x) { dirty = false; clearInterval(timer); return x; }, function (e) { closed = false; lock(false); startTimer(); throw e; }).then(function () { setDirty(0); toast("已放弃草稿"); location.hash = "#/settings/templates"; }).catch(function (e) { failToast("没做成：", e); }); } });
    };
  }).catch(setFail);
}

// 选项
function setOptions() {
  api("/api/settings/options").then(function (r) {
    if (!setOn("options")) return;
    var block = function (key, hint, canAdd) {
      var list = r[key] || [];
      return '<section class="card" style="padding:18px 20px;display:flex;flex-direction:column;gap:8px"><div style="display:flex;align-items:baseline;gap:8px"><h2 style="margin:0;font-size:15px">' + esc(key) + '</h2><span class="hint">' + esc(hint) + "</span></div>" +
        list.map(function (o) {
          return '<div style="display:flex;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line2)"><span style="flex:1">' + esc(o.name) + ' <span class="hint">' + o.n + " 条</span></span>" +
            '<button class="btn sm text" style="color:var(--blue)" data-ren="' + esc(key) + '" data-name="' + esc(o.name) + '" data-n="' + o.n + '">改名或合并</button></div><div data-ren-box="' + esc(key + "|" + o.name) + '" hidden></div>';
        }).join("") +
        (canAdd ? '<div class="drow" style="padding-top:8px"><input class="input" style="max-width:280px" data-add-input="' + esc(key) + '" placeholder="新的' + esc(key) + '名字"><button class="btn sm" data-add="' + esc(key) + '">新增</button></div>' : "") + "</section>";
    };
    $("set-body").innerHTML = setHead("选项", "批次名不能重复；改名会把用到它的记录一起改掉", "") +
      block("入库批次", "找新人时放进哪一批", true) + block("邀约批次", "发邀约时记在跟进上", true) + block("内容类型", "全项目用到的标签和次数", false);
    all("[data-add]").forEach(function (b) { b.onclick = function () {
      var key = b.getAttribute("data-add"), v = document.querySelector('[data-add-input="' + key + '"]').value.trim();
      if (!v) { toast("先写名字", { bad: true }); return; }
      if ((r[key] || []).some(function (o) { return o.name === v; })) { toast("「" + v + "」已经有了", { bad: true }); return; }
      post("/api/settings/option-add", { which: key, name: v }).then(function () { toast("已加上「" + v + "」"); setOptions(); }).catch(function (e) { failToast("没加上：", e); });
    }; });
    all("[data-ren]").forEach(function (b) { b.onclick = function () {
      var key = b.getAttribute("data-ren"), name = b.getAttribute("data-name"), n = b.getAttribute("data-n");
      var box = document.querySelector('[data-ren-box="' + key + "|" + name + '"]');
      inlineConfirm(box, { title: "把「" + name + "」改成", ok: "确定", blue: true,
        body: '<input class="input" id="ren-to" value="' + esc(name) + '"><div class="hint" id="ren-hint">用到它的 ' + n + " 条会一起改</div>",
        check: function (bx) { var v = bx.querySelector("#ren-to").value.trim(); if (!v || v === name) return false; return v; },
        run: function (to) { post("/api/settings/option-rename", { which: key, from: name, to: to }).then(function (x) { toast("已改，动了 " + x.changed + " 条"); setOptions(); }).catch(function (e) { failToast("没改成：", e); }); } });
      $("ren-to").addEventListener("input", function () {
        var v = $("ren-to").value.trim(), hit = (r[key] || []).some(function (o) { return o.name === v && v !== name; });
        $("ren-hint").textContent = hit ? "「" + v + "」已经有了：会合并进去，" + n + " 条改成「" + v + "」" : "用到它的 " + n + " 条会一起改";
        $("ren-hint").style.color = hit ? "var(--bad)" : "";
        // A merge moves records into another option and can't be split back: shown as a red, irreversible step.
        box.querySelector(".confirm").classList.toggle("blue", !hit);
        box.querySelector("[data-ok]").className = "btn sm " + (hit ? "solid-bad" : "primary");
        box.querySelector("[data-ok]").textContent = hit ? "确定合并" : "确定";
      });
    }; });
    wireHistory(function (x) { return /^选项/.test(x.what); });
  }).catch(setFail);
}

// 接入和执行电脑
function setAccess() {
  api("/api/settings/access").then(function (a) {
    if (!setOn("access")) return;
    var kv = function (k, v) { return '<div class="kv"><span class="muted">' + esc(k) + "</span><span>" + v + "</span></div>"; };
    var yes = function (b) { return b ? '<span class="badge b-ok">这台电脑已保存</span>' : '<span class="badge b-warn">这台电脑没有</span>'; };
    $("set-body").innerHTML = setHead("接入和执行电脑", "", "") +
      '<section class="card" style="padding:18px 20px"><h2 style="margin:0 0 6px;font-size:15px">执行电脑</h2>' + kv("设置里的执行电脑", esc(a.executor || "没填：哪台电脑都能执行")) + kv("这台电脑", esc(a.thisMachine) + (a.isExecutor ? ' <span class="badge b-ok">能执行</span>' : ' <span class="badge b-warn">不能执行</span>')) +
        '<div class="hint" style="margin-top:8px">换执行电脑：在那台电脑上运行 kol executor claim</div></section>' +
      '<section class="card" style="padding:18px 20px;display:flex;flex-direction:column;gap:10px"><h2 style="margin:0;font-size:15px">业务数据接口</h2>' +
        '<div class="drow"><input class="input" id="api-url" value="' + esc(a.dataApi) + '" placeholder="https://" style="flex:1 1 320px"><button class="btn" id="api-save">保存</button></div>' +
        kv("接口密钥", yes(a.hasKey)) + kv("体验码写密钥", yes(a.hasTrialKey)) + kv("活动码写密钥", yes(a.hasPartnerKey)) +
        '<div class="hint">密钥不在页面上显示，也不在这里改：用 kol project set-key / set-trial-key / set-partner-key</div></section>' +
      '<section class="card" style="padding:18px 20px"><h2 style="margin:0 0 6px;font-size:15px">通知和数据</h2>' + kv("飞书群机器人", a.webhook ? "已配置" : "没配置") + kv("数据库", esc(a.database || "飞书多维表格")) +
        '<div class="hint" style="margin-top:8px">只显示连接到哪里，不显示连接串</div></section>';
    wireHistory(function (x) { return /^业务数据接口/.test(x.what); });
    $("api-save").onclick = function () {
      post("/api/settings/data-api", { url: $("api-url").value }).then(function () { toast("已保存业务数据接口"); setAccess(); }).catch(function (e) { failToast("没保存：", e); });
    };
  }).catch(setFail);
}

// --- 路由 ---
function route() {
  var h = location.hash.replace(/^#/, "") || "/";
  var query = h.split("?")[1] || "";
  var parts = h.split("?")[0].split("/").filter(Boolean);
  var tab = parts[0] === "people" || parts[0] === "person" ? "people" : parts[0] === "log" ? "log" : parts[0] === "settings" ? "settings" : "decide";
  all("[data-tab]").forEach(function (a) { a.classList.toggle("on", a.getAttribute("data-tab") === tab); });
  $("app").classList.toggle("wide", tab === "decide");
  if (!state.overview) return;
  renderBanners();
  var m = query.match(/(?:^|&)card=([^&]+)/);
  if (m) state.focus = decodeURIComponent(m[1]);
  if (parts[0] === "people") renderPeople(parts[1] || "wait", "");
  else if (parts[0] === "person" && parts[1]) renderPerson(decodeURIComponent(parts[1]));
  else if (parts[0] === "log") renderLog();
  else if (parts[0] === "settings") renderSettings(parts[1], parts[2] && decodeURIComponent(parts[2]));
  else renderDecide();
}
window.addEventListener("hashchange", function () { route(); window.scrollTo(0, 0); });
var SEEN_KEY = "kol-console-seen";
function loadNews() {
  var since = 0;
  try { since = Number(localStorage.getItem(SEEN_KEY)) || 0; } catch (e) {}
  if (!since) since = Date.now() - 24 * 3600 * 1000;
  return api("/api/news?since=" + since).then(function (n) {
    state.news = n;
    // Filled in place, so a draft being edited isn't redrawn.
    var box = $("news");
    if (box) box.innerHTML = newsBlock();
  }).catch(function () {});
}
function markSeen() { try { localStorage.setItem(SEEN_KEY, String(Date.now())); } catch (e) {} }
window.addEventListener("pagehide", markSeen);
loadOverview().then(function () { route(); loadNews(); }).catch(fail);
setInterval(function () { loadOverview().then(function () { if ((!location.hash || location.hash === "#/") && $("drawer").hidden) renderDecide(); }).catch(function () {}); }, 5 * 60 * 1000);
</script>
